<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#071426">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../assets/mbale-media-daily-logo.png">
<title>Mbale Media Daily Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071426;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(440px,100%);background:#fff;color:#17202a;border-radius:22px;padding:30px;box-shadow:0 20px 70px #0007;text-align:center}.logo{width:76px;height:76px;object-fit:contain;margin:0 auto 14px;display:block}.brand{font:900 27px Georgia;margin:0}.brand span{color:#e4032e}.sub{color:#667085;font-size:13px;line-height:1.5;margin:8px 0 22px}.status{background:#f2f5f8;border-radius:12px;padding:13px;font-size:12px;line-height:1.5;margin-bottom:16px}.btn{display:block;width:100%;text-decoration:none;border:0;border-radius:11px;padding:14px;margin-top:9px;background:#e4032e;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.btn.dark{background:#10284a}.btn.light{background:#eef2f6;color:#10284a}.note{font-size:11px;color:#667085;line-height:1.6;margin-top:18px}.hide{display:none}a:focus-visible,button:focus-visible{outline:3px solid #071426;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="../assets/mbale-media-daily-logo.png" alt="Mbale Media Daily">
<h1 class="brand">MBALE <span>MEDIA</span> ADMIN</h1>
<p class="sub">Private newsroom control centre</p>
<div class="status" id="status">Checking your administrator session…</div>
<div id="actions" class="hide">
<a class="btn" href="../administrator-login.html">Open Secure Administrator Login</a>
<a class="btn dark" href="../administrator-dashboard-v2.html">Open Control Centre</a>
<button class="btn light" id="install" type="button">Install Admin App</button>
</div>
<p class="note">This app is only a shortcut to the private administration system. Authentication and administrator permissions remain enforced by the newsroom.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DB_URL='https://dwbgcaxwemrwheybdpya.supabase.co';
const DB_KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8';
const ADMIN='81148dcd-10b8-4f85-a2b0-635fc7c250cf';
const db=supabase.createClient(DB_URL,DB_KEY);
const statusEl=document.getElementById('status');
const actions=document.getElementById('actions');
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;document.getElementById('install').classList.remove('hide')});
document.getElementById('install').addEventListener('click',async()=>{if(!deferredPrompt){statusEl.textContent='If the install prompt is not available, use Chrome menu → Add to Home screen or Install app.';return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null});
(async()=>{try{const{data}=await db.auth.getSession();if(data.session?.user?.id===ADMIN){statusEl.textContent='Administrator session found. Opening your control centre…';setTimeout(()=>location.replace('../administrator-dashboard-v2.html'),250);return}statusEl.textContent='Secure administrator access ready.';actions.classList.remove('hide')}catch(e){statusEl.textContent='Secure access is ready. Please use the administrator login.';actions.classList.remove('hide')}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
