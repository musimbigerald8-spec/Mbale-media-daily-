<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Mbale Media Daily</title><style>body{margin:0;background:#f5f6f8;color:#17202a;font-family:Arial,sans-serif}.head{background:#071426;color:#fff;padding:28px 5%;text-align:center}.head h1{font:900 36px Georgia;margin:0}.head b{color:#e4032e}.wrap{max-width:850px;margin:auto;padding:30px 5% 60px}.box{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:28px;margin-top:20px;line-height:1.75}.back{display:inline-block;background:#e4032e;color:#fff;text-decoration:none;padding:11px 16px;border-radius:5px;font-weight:800}.field{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd3dc;border-radius:5px;font-size:15px;box-sizing:border-box}textarea{min-height:150px}.btn{background:#e4032e;color:#fff;border:0;padding:12px 18px;border-radius:5px;font-weight:800}.email{font-weight:800;color:#071426}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #071426;outline-offset:3px}</style></head><body><header class="head"><h1>MBALE <b>MEDIA</b> DAILY</h1><div>CONTACT THE NEWSROOM</div></header><main class="wrap"><a class="back" href="index.html">← Home</a><div class="box"><h2>Contact Mbale Media Daily</h2><p>Send news tips, story ideas, corrections, advertising or general enquiries to <span class="email">Mbalemediadailymbale@gmail.com</span>.</p><form onsubmit="send(event)"><input id="name" class="field" placeholder="Your name" required><input id="email" class="field" type="email" placeholder="Your email" required><input id="subject" class="field" placeholder="Subject" required><textarea id="message" class="field" placeholder="Your message" required></textarea><button class="btn">Send to newsroom</button></form></div></main><script>function send(e){e.preventDefault();let s=encodeURIComponent(document.getElementById('subject').value);let b=encodeURIComponent('Name: '+document.getElementById('name').value+'\nEmail: '+document.getElementById('email').value+'\n\n'+document.getElementById('message').value);window.location.href='mailto:Mbalemediadailymbale@gmail.com?subject='+s+'&body='+b}</script></body></html>
