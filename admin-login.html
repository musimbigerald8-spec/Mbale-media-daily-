<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Mbale Media Daily • Administrator Sign In</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--nav:#071426;--red:#e4032e;--bg:#f4f6fa;--card:#fff;--ink:#17202a;--muted:#667085;--line:#d9e0e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;font-weight:900}.top span{margin-left:10px}.wrap{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 35px #07142614}.logo{display:block;width:58px;height:58px;object-fit:contain;margin:0 auto 15px}.card h1{text-align:center;font:900 30px Georgia;margin:0 0 8px}.sub{text-align:center;color:var(--muted);margin:0 0 25px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:var(--red);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.65}.status{min-height:22px;margin:13px 0 0;text-align:center;font-weight:800}.info{margin-top:18px;background:#eef6ff;border:1px solid #c9def7;border-radius:10px;padding:12px;font-size:12px;line-height:1.5;color:#334155}.footer{text-align:center;color:#98a2b3;font-size:11px;margin-top:20px}</style></head><body><header class="top">🔐 <span>MBALE MEDIA DAILY — ADMINISTRATION</span></header><main class="wrap"><section class="card"><img class="logo" src="assets/mbale-media-daily-logo.png" alt="Mbale Media Daily"><h1>Administrator Sign In</h1><p class="sub">Secure Newsroom Control Center</p><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="btn" class="btn" type="submit">Sign in securely</button><div id="status" class="status" role="alert"></div></form><div class="info"><strong>Administrator access only.</strong><br>Your account must be the approved Mbale Media Daily administrator account. Editors and journalists must use their own portals.</div><div class="footer">Mbale Media Daily • Newsroom Headquarters</div></section></main><script>const DB_URL='https://dwbgcaxwemrwheybdpya.supabase.co';const DB_KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8';const ADMIN='81148dcd-10b8-4f85-a2b0-635fc7c250cf';const statusEl=document.getElementById('status');const btn=document.getElementById('btn');const client=window.supabase.createClient(DB_URL,DB_KEY);function msg(t,ok){statusEl.textContent=t;statusEl.style.color=ok?'#15803d':'#b42318'}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg('Checking administrator account…',true);try{const{data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const user=data.user;if(!user||user.id!==ADMIN){await client.auth.signOut();throw new Error('This account is not the approved Mbale Media Daily administrator account.')}msg('Sign-in successful. Opening Admin Control Center…',true);setTimeout(()=>location.replace('admin-control-center.html?admin='+Date.now()),250)}catch(err){msg(err?.message||'Sign-in failed. Please check your email and password.',false);btn.disabled=false;btn.textContent='Sign in securely'}});</script><script src="assets/mbale-media-ai.js" defer></script>
</body></html>
