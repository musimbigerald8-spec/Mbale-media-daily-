<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Mbale Media Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071426;--r:#e4032e;--g:#d4af37;--p:#f4f6f8;--l:#dfe3e8}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial;color:#17202a}.top{background:var(--n);color:#fff;padding:16px 5%;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:25px 5%}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:22px;margin-bottom:20px}.logo{width:110px;height:110px;object-fit:contain;display:block;margin:auto}.btn{background:var(--r);color:#fff;border:0;border-radius:6px;padding:12px 18px;font-weight:900;cursor:pointer}.danger{background:#9d1125}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #c8d0d8;border-radius:6px;font:inherit}.field textarea{min-height:190px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hide{display:none}.status{font-weight:800;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--l);padding:14px 0}.row button{margin-left:5px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{flex-direction:column}.row button{margin:5px 5px 0 0}}</style></head><body><div class="top">🔐 MBALE MEDIA ADMIN • Every Story Matters</div><main class="wrap"><div class="card" style="text-align:center"><img class="logo" src="https://musimbigerald8-spec.github.io/Mbale-media-daily-/assets/mbale-media-daily-logo.png?v=9"><h1>Mbale Media Administration</h1><p>Secure publishing dashboard</p></div><section id="login" class="card"><h2>Administrator Sign In</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">Sign in</button><div id="loginStatus" class="status"></div></section><section id="dash" class="hide"><div class="card"><h2 id="formTitle">Publish a News Story</h2><input id="editId" type="hidden"><div class="grid"><div class="field"><label>Headline *</label><input id="title"></div><div class="field"><label>Category</label><select id="category"><option>Local</option><option>National</option><option>Sports</option><option>Global</option><option>Feature</option></select></div></div><div class="field"><label>Summary</label><input id="excerpt"></div><div class="field"><label>Full Story *</label><textarea id="content"></textarea></div><div class="grid"><div class="field"><label>Author</label><input id="author" value="Mbale Media"></div><div class="field"><label>Image</label><input id="image" type="file" accept="image/*"></div></div><p><label><input id="breaking" type="checkbox"> Breaking</label> &nbsp; <label><input id="featured" type="checkbox"> Featured</label> &nbsp; <label><input id="published" type="checkbox" checked> Published</label></p><button id="save" class="btn" onclick="save()">Publish Story</button> <button class="btn" style="background:#52606d" onclick="clearForm()">Clear</button><button class="btn danger" style="float:right" onclick="logout()">Log out</button><div id="saveStatus" class="status"></div></div><div class="card"><h2>Stories</h2><div id="stories">Loading…</div></div></section></main><script>const URL='https://dwbgcaxwemrwheybdpya.supabase.co',KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8',ADMIN='81148dcd-10b8-4f85-a2b0-635fc7c250cf',db=supabase.createClient(URL,KEY);let me=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function session(){let r=await db.auth.getSession();me=r.data.session?.user||null;ui()}function ui(){let ok=me&&me.id===ADMIN;$('login').classList.toggle('hide',!!ok);$('dash').classList.toggle('hide',!ok);if(ok)loadStories()}async function login(){let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error){$('loginStatus').textContent=r.error.message;return}if(r.data.user.id!==ADMIN){await db.auth.signOut();$('loginStatus').textContent='This account is not the Mbale Media administrator.';return}me=r.data.user;ui()}async function logout(){await db.auth.signOut();me=null;ui()}async function upload(f){if(!f)return null;if(f.size>8*1024*1024)throw Error('Image must be under 8 MB');let ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg',path=me.id+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext,r=await db.storage.from('news-images').upload(path,f,{contentType:f.type||'image/jpeg'});if(r.error)throw r.error;return db.storage.from('news-images').getPublicUrl(path).data.publicUrl}async function save(){if(!me)return;$('saveStatus').textContent='Saving…';try{let title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content)throw Error('Headline and full story are required.');let f=$('image').files[0],image_url=f?await upload(f):null,id=$('editId').value,p={title,slug:title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),excerpt:$('excerpt').value.trim(),content,image_url,category:$('category').value,author:$('author').value.trim()||'Mbale Media',featured:$('featured').checked,breaking:$('breaking').checked,published:$('published').checked,updated_at:new Date().toISOString()},r=id?await db.from('news').update(p).eq('id',id):await db.from('news').insert(p);if(r.error)throw r.error;$('saveStatus').textContent='Story saved successfully.';clearForm();loadStories()}catch(e){$('saveStatus').textContent=e.message} }function clearForm(){$('editId').value='';$('title').value='';$('excerpt').value='';$('content').value='';$('author').value='Mbale Media';$('category').value='Local';$('breaking').checked=false;$('featured').checked=false;$('published').checked=true;$('image').value='';$('formTitle').textContent='Publish a News Story';$('save').textContent='Publish Story'}async function loadStories(){let r=await db.from('news').select('*').order('created_at',{ascending:false});if(r.error){$('stories').textContent=r.error.message;return}if(!r.data.length){$('stories').textContent='No stories yet.';return}$('stories').innerHTML=r.data.map(s=>`<div class="row"><div><b>${esc(s.title)}</b><br><small>${esc(s.category)} • ${s.published?'Published':'Draft'}</small></div><div><button onclick="edit(${s.id})">Edit</button><button class="btn danger" onclick="del(${s.id})">Delete</button></div></div>`).join('')}async function edit(id){let r=await db.from('news').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);let s=r.data;$('editId').value=s.id;$('title').value=s.title||'';$('excerpt').value=s.excerpt||'';$('content').value=s.content||'';$('author').value=s.author||'Mbale Media';$('category').value=s.category||'Local';$('breaking').checked=!!s.breaking;$('featured').checked=!!s.featured;$('published').checked=!!s.published;$('formTitle').textContent='Edit News Story';$('save').textContent='Update Story';scrollTo({top:0,behavior:'smooth'})}async function del(id){if(!confirm('Delete this story permanently?'))return;let r=await db.from('news').delete().eq('id',id);if(r.error)return alert(r.error.message);loadStories()}db.auth.onAuthStateChange((_e,s)=>{me=s?.user||null;ui()});session();</script><script src="assets/mbale-media-ai.js" defer></script>
</body></html>
