<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Mbale Media Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a}.top{background:#071426;color:#fff;padding:16px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dfe3e8;border-radius:14px;padding:22px;margin-bottom:20px}.logo{width:110px;height:110px;object-fit:contain;display:block;margin:auto}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #c8d0d8;border-radius:7px;font-size:16px;box-sizing:border-box}.field textarea{min-height:180px}.btn{background:#e4032e;color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6}.dark{background:#071426}.gray{background:#52606d}.green{background:#087a35}.danger{background:#9d1125}.hide{display:none}.status{margin-top:12px;font-weight:700;white-space:pre-wrap}.ok{color:#087a35}.err{color:#b00020}.story{padding:16px 0;border-bottom:1px solid #ddd}.story h3{margin:0 0 6px}.story small{color:#667085}.actions{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e8edf2;color:#17202a;border:0;border-radius:20px;padding:9px 14px;font-weight:800;cursor:pointer}.tab.active{background:#071426;color:#fff}.search{margin-bottom:15px}.search input{width:100%;padding:13px;border:1px solid #c8d0d8;border-radius:7px;font-size:16px;box-sizing:border-box}@media(max-width:600px){.wrap{padding:12px}.card{padding:18px}}</style></head><body><div class="top">🔐 MBALE MEDIA ADMIN • Secure Newsroom</div><main class="wrap"><div class="card" style="text-align:center"><img decoding="async" class="logo" src="https://musimbigerald8-spec.github.io/Mbale-media-daily-/assets/mbale-media-daily-logo.png?v=10"><h1>Mbale Media Administration</h1><p>Authorized administrator access only</p></div><section id="loginCard" class="card"><h2>Administrator Sign In</h2><p>Only the authorized Mbale Media administrator can publish, edit or manage stories.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn">Sign in</button><div id="loginStatus" class="status"></div></section><section id="dashboard" class="hide"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 id="formTitle">Publish a News Story</h2><button id="logoutBtn" class="btn danger">Sign out</button></div><p id="signedInAs" style="font-size:13px;color:#667085"></p><input id="editId" type="hidden"><div class="field"><label>Headline *</label><input id="title"></div><div class="field"><label>Category</label><select id="category"><option>Local</option><option>National</option><option>Sports</option><option>Entertainment</option><option>Global</option><option>Feature</option></select></div><div class="field"><label>Summary</label><input id="excerpt"></div><div class="field"><label>Full Story *</label><textarea id="content"></textarea></div><div class="field"><label>Replace Image (optional)</label><input id="image" type="file" accept="image/*"></div><div class="field"><label>Author</label><input id="author" value="Mbale Media"></div><p><label><input id="breaking" type="checkbox"> Breaking</label> &nbsp; <label><input id="featured" type="checkbox"> Featured</label> &nbsp; <label><input id="published" type="checkbox" checked> Published</label></p><button id="saveBtn" class="btn">Publish Story</button> <button id="clearBtn" class="btn gray">Clear</button><div id="saveStatus" class="status"></div></div><div class="card"><h2>📰 Story Manager</h2><div class="tabs"><button id="activeTab" class="tab active">Active Stories</button><button id="trashTab" class="tab">♻️ Recycle Bin</button></div><div class="search"><input id="search" placeholder="Search headlines, categories or authors…"></div><div id="stories">Loading…</div></div></section></main><script>
(function(){'use strict';
const PROJECT_URL='https://dwbgcaxwemrwheybdpya.supabase.co',PUBLISHABLE_KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8',ADMIN_UID='81148dcd-10b8-4f85-a2b0-635fc7c250cf';
let client=null,currentUser=null,authReady=false,view='active',allStories=[];const $=id=>document.getElementById(id);
function status(el,msg,good){el.textContent=msg;el.className='status '+(good?'ok':'err')}
function isAdmin(u){return !!u&&u.id===ADMIN_UID}
function showLogin(msg){$('loginCard').classList.remove('hide');$('dashboard').classList.add('hide');if(msg)status($('loginStatus'),msg,false)}
function showDash(){if(!isAdmin(currentUser))return showLogin('Administrator authorization required.');$('loginCard').classList.add('hide');$('dashboard').classList.remove('hide');$('signedInAs').textContent='Signed in as: '+(currentUser.email||'Mbale Media administrator');loadStories()}
async function start(){if(!window.supabase){status($('loginStatus'),'Secure connection library did not load. Refresh the page.',false);return}try{client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);const r=await client.auth.getSession();if(r.error)throw r.error;currentUser=r.data.session?.user||null;authReady=true;if(isAdmin(currentUser))showDash();else showLogin(currentUser?'This account is not authorized to access Mbale Media Administration.':'');client.auth.onAuthStateChange((_e,s)=>{currentUser=s?.user||null;if(isAdmin(currentUser))showDash();else showLogin(currentUser?'This account is not authorized to access Mbale Media Administration.':'')})}catch(e){status($('loginStatus'),'Connection error: '+(e.message||e),false)}}
async function login(){if(!authReady)return status($('loginStatus'),'Please wait for the secure connection.',false);const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return status($('loginStatus'),'Enter administrator email and password.',false);$('loginBtn').disabled=true;$('loginBtn').textContent='Signing in…';try{const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;currentUser=r.data.user;if(!isAdmin(currentUser)){await client.auth.signOut();currentUser=null;throw new Error('Access denied. This account is not the Mbale Media administrator')}showDash()}catch(e){status($('loginStatus'),e.message||'Sign-in failed.',false)}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Sign in'}}
async function logout(){if(client)await client.auth.signOut();currentUser=null;showLogin('You have been signed out.');$('password').value=''}
async function upload(file){if(!isAdmin(currentUser))throw new Error('Administrator sign-in required.');if(!file)return null;if(file.size>8*1024*1024)throw new Error('Image must be under 8 MB.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';const path=currentUser.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const r=await client.storage.from('news-images').upload(path,file,{contentType:file.type||'image/jpeg'});if(r.error)throw r.error;return client.storage.from('news-images').getPublicUrl(path).data.publicUrl}
async function save(){if(!isAdmin(currentUser))return showLogin('Your administrator session has ended. Please sign in again.');status($('saveStatus'),'Saving…',true);try{const title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content)throw new Error('Headline and full story are required.');const id=$('editId').value;let oldImage=null;if(id){const old=await client.from('news').select('image_url').eq('id',id).single();if(old.error)throw old.error;oldImage=old.data.image_url||null}let image_url=oldImage;if($('image').files[0])image_url=await upload($('image').files[0]);const p={title,slug:title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),excerpt:$('excerpt').value.trim(),content,image_url,category:$('category').value,author:$('author').value.trim()||'Mbale Media',featured:$('featured').checked,breaking:$('breaking').checked,published:$('published').checked,updated_at:new Date().toISOString()};const r=id?await client.from('news').update(p).eq('id',id):await client.from('news').insert(p);if(r.error)throw r.error;status($('saveStatus'),id?'Story updated successfully.':'Story published successfully.',true);clearForm();loadStories()}catch(e){status($('saveStatus'),e.message||String(e),false)}}
function clearForm(){$('editId').value='';$('title').value='';$('excerpt').value='';$('content').value='';$('author').value='Mbale Media';$('category').value='Local';$('breaking').checked=false;$('featured').checked=false;$('published').checked=true;$('image').value='';$('formTitle').textContent='Publish a News Story';$('saveBtn').textContent='Publish Story'}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
async function loadStories(){if(!isAdmin(currentUser))return;$('stories').textContent='Loading stories…';try{const r=await client.from('news').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;const rows=r.data||[];allStories=rows.filter(s=>view==='active'?!s.deleted_at:!!s.deleted_at);renderStories()}catch(e){$('stories').textContent='Could not load stories: '+(e.message||e)}}
function renderStories(){const term=$('search').value.trim().toLowerCase();const data=allStories.filter(s=>!term||[s.title,s.category,s.author,s.excerpt].some(x=>String(x||'').toLowerCase().includes(term)));if(!data.length){$('stories').innerHTML=view==='active'?'<p>No active stories found.</p>':'<p>Recycle Bin is empty.</p>';return}$('stories').innerHTML=data.map(s=>{const date=s.created_at?new Date(s.created_at).toLocaleString():'';return '<div class="story"><h3>'+esc(s.title)+'</h3><small>'+esc(s.category||'')+' • '+(s.published?'Published':'Draft')+' • '+esc(date)+'</small><div class="actions">'+(view==='active'?'<button class="btn dark" onclick="window.editStory(\''+s.id+'\')">✏️ Edit</button><button class="btn danger" onclick="window.moveToTrash(\''+s.id+'\')">🗑️ Delete</button>':'<button class="btn green" onclick="window.restoreStory(\''+s.id+'\')">↩️ Restore</button>')+'</div></div>'}).join('')}
window.editStory=async function(id){if(!isAdmin(currentUser))return;const r=await client.from('news').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);const s=r.data;$('editId').value=s.id;$('title').value=s.title||'';$('excerpt').value=s.excerpt||'';$('content').value=s.content||'';$('author').value=s.author||'Mbale Media';$('category').value=s.category||'Local';$('breaking').checked=!!s.breaking;$('featured').checked=!!s.featured;$('published').checked=!!s.published;$('image').value='';$('formTitle').textContent='Edit News Story';$('saveBtn').textContent='Update Story';scrollTo({top:0,behavior:'smooth'})};
window.moveToTrash=async function(id){if(!isAdmin(currentUser))return;if(!confirm('Move this story to the Recycle Bin? It will disappear from the public website but can be restored later.'))return;const r=await client.from('news').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);loadStories()};
window.restoreStory=async function(id){if(!isAdmin(currentUser))return;if(!confirm('Restore this story to the active newsroom?'))return;const r=await client.from('news').update({deleted_at:null,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);loadStories()};
$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('saveBtn').addEventListener('click',save);$('clearBtn').addEventListener('click',clearForm);$('logoutBtn').addEventListener('click',logout);$('search').addEventListener('input',renderStories);$('activeTab').addEventListener('click',()=>{view='active';$('activeTab').classList.add('active');$('trashTab').classList.remove('active');loadStories()});$('trashTab').addEventListener('click',()=>{view='trash';$('trashTab').classList.add('active');$('activeTab').classList.remove('active');loadStories()});start();})();</script></body></html>
