<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Mbale Media Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071426;--r:#e4032e;--p:#f4f6f8;--l:#dfe3e8}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial;color:#17202a}.top{background:var(--n);color:#fff;padding:16px 5%;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:25px 5%}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:22px;margin-bottom:20px}.logo{width:110px;height:110px;object-fit:contain;display:block;margin:auto}.btn{background:var(--r);color:#fff;border:0;border-radius:6px;padding:12px 18px;font-weight:900;cursor:pointer}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #c8d0d8;border-radius:6px;font:inherit}.field textarea{min-height:190px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hide{display:none}.status{font-weight:800;margin-top:12px;white-space:pre-wrap}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--l);padding:14px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="top">🔐 MBALE MEDIA ADMIN • Every Story Matters</div><main class="wrap"><div class="card" style="text-align:center"><img class="logo" src="https://musimbigerald8-spec.github.io/Mbale-media-daily-/assets/mbale-media-daily-logo.png?v=9"><h1>Mbale Media Administration</h1><p>Secure publishing dashboard</p></div><section id="login" class="card"><h2>Administrator Sign In</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" type="button">Sign in</button><div id="loginStatus" class="status">Ready.</div></section><section id="dash" class="hide"><div class="card"><h2 id="formTitle">Publish a News Story</h2><input id="editId" type="hidden"><div class="grid"><div class="field"><label>Headline *</label><input id="title"></div><div class="field"><label>Category</label><select id="category"><option>Local</option><option>National</option><option>Sports</option><option>Global</option><option>Feature</option></select></div></div><div class="field"><label>Summary</label><input id="excerpt"></div><div class="field"><label>Full Story *</label><textarea id="content"></textarea></div><div class="grid"><div class="field"><label>Author</label><input id="author" value="Mbale Media"></div><div class="field"><label>Image</label><input id="image" type="file" accept="image/*"></div></div><p><label><input id="breaking" type="checkbox"> Breaking</label> <label><input id="featured" type="checkbox"> Featured</label> <label><input id="published" type="checkbox" checked> Published</label></p><button id="save" class="btn" type="button">Publish Story</button> <button id="clear" class="btn" type="button" style="background:#52606d">Clear</button><button id="logout" class="btn" type="button" style="float:right;background:#9d1125">Log out</button><div id="saveStatus" class="status"></div></div><div class="card"><h2>Stories</h2><div id="stories">Loading…</div></div></section></main><script>
(function(){
'use strict';
const SUPABASE_URL='https://dwbgcaxwemrwheybdpya.supabase.co';
const SUPABASE_KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8';
const ADMIN_ID='81148dcd-10b8-4f85-a2b0-635fc7c250cf';
const $=id=>document.getElementById(id);
let db=null,me=null;
function status(t){$('loginStatus').textContent=t;}
function show(){const ok=!!me&&me.id===ADMIN_ID;$('login').classList.toggle('hide',ok);$('dash').classList.toggle('hide',!ok);if(ok)loadStories();}
async function init(){try{if(typeof window.supabase==='undefined'){status('Supabase library did not load. Refresh the page and try again.');return;}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const r=await db.auth.getSession();if(r.error)throw r.error;me=r.data.session?r.data.session.user:null;show();}catch(e){status('Connection error: '+(e.message||e));}}
async function login(){if(!db){status('Connecting to Supabase…');await init();if(!db)return;}const email=$('email').value.trim(),password=$('pass').value;if(!email||!password){status('Enter your email and password.');return;}const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';status('Signing in…');try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.user)throw new Error('Supabase did not return a user.');if(r.data.user.id!==ADMIN_ID){await db.auth.signOut();throw new Error('This account is not the Mbale Media administrator.');}me=r.data.user;status('Signed in successfully.');show();}catch(e){status('Sign-in failed: '+(e.message||e));}finally{b.disabled=false;b.textContent='Sign in';}}
async function logout(){if(db)await db.auth.signOut();me=null;show();status('Logged out.');}
async function upload(file){if(!file)return null;if(file.size>8*1024*1024)throw new Error('Image must be under 8 MB.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';const path=me.id+'/'+Date.now()+'.'+ext;const r=await db.storage.from('news-images').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(r.error)throw r.error;return db.storage.from('news-images').getPublicUrl(path).data.publicUrl;}
async function save(){if(!me)return;$('saveStatus').textContent='Saving…';try{const title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content)throw new Error('Headline and full story are required.');const file=$('image').files[0];const image_url=file?await upload(file):null;const id=$('editId').value;const p={title,slug:title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),excerpt:$('excerpt').value.trim(),content,image_url,category:$('category').value,author:$('author').value.trim()||'Mbale Media',featured:$('featured').checked,breaking:$('breaking').checked,published:$('published').checked,updated_at:new Date().toISOString()};const r=id?await db.from('news').update(p).eq('id',id):await db.from('news').insert(p);if(r.error)throw r.error;$('saveStatus').textContent='Story saved successfully.';clearForm();loadStories();}catch(e){$('saveStatus').textContent='Save failed: '+(e.message||e);}}
function clearForm(){$('editId').value='';$('title').value='';$('excerpt').value='';$('content').value='';$('author').value='Mbale Media';$('category').value='Local';$('breaking').checked=false;$('featured').checked=false;$('published').checked=true;$('image').value='';$('formTitle').textContent='Publish a News Story';$('save').textContent='Publish Story';}
async function loadStories(){const r=await db.from('news').select('*').order('created_at',{ascending:false});if(r.error){$('stories').textContent=r.error.message;return;}if(!r.data.length){$('stories').textContent='No stories yet.';return;}$('stories').innerHTML=r.data.map(s=>'<div class="row"><div><b>'+escapeHtml(s.title)+'</b><br><small>'+escapeHtml(s.category)+' • '+(s.published?'Published':'Draft')+'</small></div></div>').join('');}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
$('loginBtn').addEventListener('click',login);$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});$('logout').addEventListener('click',logout);$('save').addEventListener('click',save);$('clear').addEventListener('click',clearForm);if(window.supabase){db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);db.auth.onAuthStateChange(function(_event,session){me=session?session.user:null;show();});}init();
})();
</script></body></html>
