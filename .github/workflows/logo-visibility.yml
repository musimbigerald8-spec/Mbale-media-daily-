name: Improve logo visibility
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/logo-visibility.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Improve header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.mast{background:#fff;border-bottom:1px solid var(--line);padding:12px 5%}.brand-row{text-align:center}.site-logo{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 4px}.brand-row .tag{margin-top:0}', '.mast{background:var(--navy);border-bottom:4px solid var(--red);padding:14px 5%}.brand-row{text-align:center}.site-logo{width:205px;height:205px;object-fit:contain;display:block;margin:0 auto 2px}.brand-row .tag{margin-top:0;color:#fff;font-weight:800}')
          s=s.replace('@media(max-width:700px){.top{font-size:10px}', '@media(max-width:700px){.site-logo{width:175px;height:175px}.top{font-size:10px}')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make site logo larger and clearer' || exit 0
          git push
