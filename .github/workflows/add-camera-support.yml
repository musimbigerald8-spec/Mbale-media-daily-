name: Add camera support
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[camera-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject camera capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/mbale-media-ai.js')
          s=p.read_text()
          marker="function init(){search();ai();loadNews()}"
          addition=r'''function cameraCapture(){if(!location.pathname.endsWith('journalist.html'))return;const input=document.getElementById('image_file');if(!input||document.getElementById('mbmd-camera-btn'))return;const btn=document.createElement('button');btn.id='mbmd-camera-btn';btn.type='button';btn.textContent='📷 Take Photo';btn.style.cssText='margin-top:9px;background:#071426;color:#fff;border:0;border-radius:7px;padding:12px 16px;font-weight:900;cursor:pointer';input.parentNode.appendChild(btn);const modal=document.createElement('div');modal.id='mbmd-camera-modal';modal.style.cssText='display:none;position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.86);padding:16px;align-items:center;justify-content:center';modal.innerHTML='<div style="width:min(700px,100%);background:#fff;border-radius:14px;padding:16px"><h2 style="margin-top:0">Take Story Photo</h2><video id="mbmd-camera-video" autoplay playsinline style="width:100%;border-radius:10px;background:#111;max-height:65vh;object-fit:cover"></video><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="mbmd-capture" type="button" style="flex:1;background:#e4032e;color:#fff;border:0;border-radius:7px;padding:13px;font-weight:900">📸 Capture</button><button id="mbmd-camera-close" type="button" style="flex:1;background:#071426;color:#fff;border:0;border-radius:7px;padding:13px;font-weight:900">Close</button></div><p id="mbmd-camera-status" style="font-size:13px;color:#667085"></p></div>';document.body.appendChild(modal);let stream=null;const video=modal.querySelector('#mbmd-camera-video'),status=modal.querySelector('#mbmd-camera-status');function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;modal.style.display='none'}btn.onclick=async()=>{modal.style.display='flex';status.textContent='Requesting camera permission…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;status.textContent='Camera ready. Take the photo.'}catch(e){status.textContent='Camera unavailable or permission was denied. You can still choose an image from your device.'}};modal.querySelector('#mbmd-camera-close').onclick=stop;modal.addEventListener('click',e=>{if(e.target===modal)stop()});modal.querySelector('#mbmd-capture').onclick=()=>{if(!stream||!video.videoWidth)return;const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);c.toBlob(blob=>{if(!blob)return;const f=new File([blob],'mbale-media-photo-'+Date.now()+'.jpg',{type:'image/jpeg'});const dt=new DataTransfer();dt.items.add(f);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));stop()},'image/jpeg',.9)}};if(!navigator.mediaDevices?.getUserMedia){btn.disabled=true;btn.textContent='📷 Camera not supported in this browser'}}
'''
          if 'function cameraCapture()' not in s:
              if marker not in s: raise SystemExit('init marker not found')
              s=s.replace(marker, addition+marker.replace('loadNews()','loadNews();cameraCapture()'))
              p.write_text(s)
          PY
      - name: Commit camera fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mbale-media-ai.js
          git diff --cached --quiet || (git commit -m "Add camera capture support [camera-fix]" && git push)
