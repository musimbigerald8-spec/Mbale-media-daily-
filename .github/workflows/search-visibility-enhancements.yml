name: Search visibility enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Add visible breadcrumbs and preferred-source controls
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import json
          import re

          base = 'https://musimbigerald8-spec.github.io/'
          changed = []
          style = '<style id="mbmd-search-enhancements">.mbmd-breadcrumbs{max-width:900px;margin:0 auto;padding:14px 5%;font-size:13px;color:#667085;display:flex;gap:8px;flex-wrap:wrap}.mbmd-breadcrumbs a{color:#071426;font-weight:700}.mbmd-preferred-source{margin-top:20px;text-align:center}</style>'

          for path in Path('.').glob('article-*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              title_match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              title = unescape(title_match.group(1).strip()) if title_match else path.stem.replace('-', ' ').title()

              breadcrumb_data = {
                  '@context': 'https://schema.org',
                  '@type': 'BreadcrumbList',
                  'itemListElement': [
                      {'@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': base},
                      {'@type': 'ListItem', 'position': 2, 'name': 'News', 'item': base + 'news.html'},
                      {'@type': 'ListItem', 'position': 3, 'name': title}
                  ]
              }
              breadcrumb_script = '<script type="application/ld+json">' + json.dumps(breadcrumb_data, ensure_ascii=False, separators=(',', ':')) + '</script>'

              # Replace the earlier BreadcrumbList from this workflow, or add it once.
              text, replaced = re.subn(
                  r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>\s*\{.*?"@type"\s*:\s*"BreadcrumbList".*?</script>',
                  breadcrumb_script,
                  text,
                  count=1,
                  flags=re.I | re.S
              )
              if replaced == 0:
                  text = text.replace('</head>', breadcrumb_script + '</head>', 1)

              if 'class="mbmd-breadcrumbs"' not in text:
                  crumbs = (
                      '<nav class="mbmd-breadcrumbs" aria-label="Breadcrumb">'
                      '<a href="' + base + '">Home</a><span aria-hidden="true">›</span>'
                      '<a href="' + base + 'news.html">News</a><span aria-hidden="true">›</span>'
                      '<span>' + title + '</span></nav>'
                  )
                  text = text.replace('<main', crumbs + '<main', 1)

              if 'google-add-preferred-source-btn' not in text:
                  preferred_script = '<script async src="https://news.google.com/swg/js/v1/publisher.js"></script>'
                  text = text.replace('</head>', preferred_script + '</head>', 1)
                  preferred_control = '<div class="mbmd-preferred-source" aria-label="Google preferred source"><div google-add-preferred-source-btn></div></div>'
                  text = text.replace('</main>', preferred_control + '</main>', 1)

              if 'id="mbmd-search-enhancements"' not in text:
                  text = text.replace('</head>', style + '</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Enhanced:', len(changed), 'article pages')
          print('\n'.join(changed))
          PY

      - name: Commit enhancements
        run: |
          git config user.name "Mbale Media Daily Search Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'article-*.html'
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Improve article breadcrumbs and preferred sources"
            git push
          fi
