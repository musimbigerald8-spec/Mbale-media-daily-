name: Add King Oyo burial photos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-photos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed uploaded burial photos in article
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('article-tooro-succession-latest.html')
          s = p.read_text(encoding='utf-8')

          photo1 = 'https://live.staticflickr.com/65535/55507715970_c2e188b947_c.jpg'
          photo2 = 'https://live.staticflickr.com/65535/55506334282_2cee0ed132_c.jpg'

          old = 'https://sportal365images.com/process/smp-images-production/pulse.ug/13092025/1fa0fe4e-2b75-4812-9079-deaac90c715f.jpeg?operations=autocrop%28700%3A467%29'
          s = s.replace(old, photo1)

          start = s.find('<h2>Official funeral photographs</h2>')
          end = s.find('<h2>The succession dispute</h2>')
          if start != -1 and end != -1:
              section = '''<h2>Official burial photographs</h2>
          <p>Mbale Media Daily is publishing the uploaded photographs from the Tooro burial coverage directly in this story, with credit to the Uganda Media Centre.</p>
          <div class="photo-box" id="oyo-photo-1"><img class="lead-photo" src="%s" alt="Tooro Kingdom mourning ceremony" loading="lazy"><p class="caption">Tooro Kingdom mourning ceremony. Photo: Uganda Media Centre.</p></div>
          <div class="photo-box" id="oyo-photo-2"><img class="lead-photo" src="%s" alt="Mourners and officials during the Tooro Kingdom burial ceremonies" loading="lazy"><p class="caption">Mourners and officials during the Tooro Kingdom burial ceremonies. Photo: Uganda Media Centre.</p></div>
          ''' % (photo1, photo2)
              s = s[:start] + section + s[end:]

          s = s.replace('This image is retained from the earlier report; see the official Uganda Media Centre gallery below for burial and funeral photographs.', 'Photo: Uganda Media Centre.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-tooro-succession-latest.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish uploaded Tooro burial photos"
            git push
          fi
