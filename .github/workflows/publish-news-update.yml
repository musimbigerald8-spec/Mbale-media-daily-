name: Publish latest news update

on:
  push:
    paths:
      - 'assets/news-update.js'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject news update script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','latest-news.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              tag='<script src="assets/news-update.js" defer></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'</body>', 1)
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'Mbale Media Daily'
          git config user.email 'mbale-media-daily@users.noreply.github.com'
          git add index.html latest-news.html
          git diff --cached --quiet || git commit -m 'Publish latest news update'
          git push
