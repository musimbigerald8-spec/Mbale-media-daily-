name: Add CEO Profile to menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CEO Profile menu link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="about.html">CEO Profile</a>' not in s:
              marker = '<a href="audio.html">Audio</a></nav>'
              if marker not in s:
                  raise SystemExit('Menu marker not found')
              s = s.replace(marker, '<a href="audio.html">Audio</a><a href="about.html">CEO Profile</a></nav>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit menu update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "CEO Profile already present"
            exit 0
          fi
          git commit -m "Add CEO Profile to main menu"
          git push
