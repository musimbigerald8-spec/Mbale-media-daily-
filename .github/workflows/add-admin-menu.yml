name: Add Admin link to navigation

on:
  push:
    paths:
      - '.github/workflows/add-admin-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-admin-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Admin menu link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<a href="admin.html">Admin</a>', '<a href="admin-dashboard.html">Admin</a>')
          text = text.replace('<a href="./admin.html">Admin</a>', '<a href="./admin-dashboard.html">Admin</a>')
          text = text.replace('<a href="/admin.html">Admin</a>', '<a href="/admin-dashboard.html">Admin</a>')
          if '<a href="admin-dashboard.html">Admin</a>' not in text:
              marker = '<a href="account.html">Account</a>'
              if marker in text:
                  text = text.replace(marker, marker + '<a href="admin-dashboard.html">Admin</a>', 1)
              else:
                  text = text.replace('</nav>', '<a href="admin-dashboard.html">Admin</a></nav>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify Admin link
        run: grep -q '<a href="admin-dashboard.html">Admin</a>' index.html

      - name: Commit homepage navigation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Admin link already correct.'
          else
            git commit -m 'Route Admin menu to new dashboard'
            git push
          fi
