name: Fix homepage logo
on:
  push:
    paths:
      - '.github/workflows/fix-homepage-logo.yml'
permissions:
  contents: write
  pages: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use the official logo on the homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/mbale-media-daily-logo.png'
          new = 'https://musimbigerald8-spec.github.io/Mbale-media-daily-/assets/mbale-media-daily-logo.png?v=8'
          s = s.replace('href="' + old + '"', 'href="' + new + '"')
          s = s.replace('src="' + old + '"', 'src="' + new + '"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage logo update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use official logo on homepage'
          git push
      - name: Request GitHub Pages rebuild
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
