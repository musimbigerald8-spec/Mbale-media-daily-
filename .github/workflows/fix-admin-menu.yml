name: Route Admin to New Dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Admin menu to new dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a href="admin.html">Admin</a>', '<a href="admin-dashboard.html">Admin</a>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Make old Admin URL redirect to new dashboard
        run: |
          if [ -f admin.html ] && [ ! -f admin-legacy.html ]; then cp admin.html admin-legacy.html; fi
          cat > admin.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=admin-dashboard.html">
            <title>Mbale Media Admin</title>
            <script>window.location.replace('admin-dashboard.html');</script>
          </head>
          <body>
            <p>Opening the new Mbale Media Admin Dashboard…</p>
            <p><a href="admin-dashboard.html">Open Admin Dashboard</a></p>
          </body>
          </html>
          EOF
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html admin-legacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route Admin to new dashboard [auto-admin]"
          git push
