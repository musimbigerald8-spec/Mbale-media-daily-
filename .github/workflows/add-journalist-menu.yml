name: Add Journalist to Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-journalist-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Journalist link if missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<a href="journalist.html">📰 Journalist</a>'
          if link not in s:
              marker = '<a href="admin.html">Admin</a>'
              if marker not in s:
                  raise SystemExit('Admin menu link not found; stopping safely.')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit menu change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Journalist link already present."
          else
            git commit -m "Add Journalist to main menu"
            git push
          fi
