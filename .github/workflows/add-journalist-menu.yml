name: Add Journalist to Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-journalist-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep Journalist link stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a href="journalist.html?v=20260915">📰 Journalist</a>', '<a href="journalist.html">📰 Journalist</a>')
          s = s.replace('<a href="./journalist.html">📰 Journalist</a>', '<a href="journalist.html">📰 Journalist</a>')
          s = s.replace('<a href="/journalist.html">📰 Journalist</a>', '<a href="journalist.html">📰 Journalist</a>')
          if '<a href="journalist.html">📰 Journalist</a>' not in s:
              marker = '<a href="admin-dashboard.html">Admin</a>'
              if marker in s:
                  s = s.replace(marker, marker + '<a href="journalist.html">📰 Journalist</a>', 1)
              else:
                  raise SystemExit('Admin dashboard link not found; stopping safely.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit menu change safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add index.html
          if git diff --cached --quiet; then
            echo "Journalist link already stable."
          else
            git commit -m "Keep Journalist in main menu"
            git push origin HEAD:main
          fi
