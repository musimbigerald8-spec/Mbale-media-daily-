name: Switch homepage to uploaded PNG logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  switch-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the uploaded PNG logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="logo.svg?v=4"', 'src="assets/mbale-media-daily-logo.png"')
          s = s.replace('src="logo.svg"', 'src="assets/mbale-media-daily-logo.png"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit logo switch
        run: |
          git config user.name "Mbale Media Daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use uploaded Mbale Media logo on homepage"
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/switch-homepage-to-uploaded-png.yml
          git add .github/workflows/switch-homepage-to-uploaded-png.yml
          git diff --cached --quiet || git commit -m "Remove one-time PNG logo workflow"
          git push
