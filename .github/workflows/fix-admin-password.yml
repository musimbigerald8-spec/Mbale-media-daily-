name: Fix Mbale Media Admin Password Reset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-password.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add secure password reset to admin page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          marker = '<button id="loginBtn" class="btn">Sign in</button>'
          link = marker + '<button id="resetBtn" type="button" style="background:transparent;border:0;color:#071426;text-decoration:underline;font-weight:800;cursor:pointer;margin-left:8px">Forgot password?</button>'
          if 'id="resetBtn"' not in s and marker in s:
              s = s.replace(marker, link, 1)

          marker2 = "$('loginBtn').addEventListener('click',login);"
          extra = r'''\n$('resetBtn')?.addEventListener('click',async function(){
  const email=$('email').value.trim();
  if(!email){status($('loginStatus'),'Enter your administrator email first, then tap Forgot password.',false);return;}
  this.disabled=true;status($('loginStatus'),'Sending a secure password-reset link…',true);
  try{
    const r=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(r.error)throw r.error;
    status($('loginStatus'),'Reset link sent. Check your email and open the link. You will then be asked to choose a new password.',true);
  }catch(e){status($('loginStatus'),e.message||String(e),false)}finally{this.disabled=false;}
});
client.auth.onAuthStateChange(async (event,session)=>{
  if(event!=='PASSWORD_RECOVERY'||!session?.user)return;
  if(session.user.id!==ADMIN_UID){await client.auth.signOut();status($('loginStatus'),'This recovery link is not for the Mbale Media administrator.',false);return;}
  const p1=prompt('Enter your new Mbale Media admin password (at least 8 characters):');
  if(!p1)return;
  if(p1.length<8){status($('loginStatus'),'Password must be at least 8 characters. Please request another reset link.',false);return;}
  const p2=prompt('Confirm your new password:');
  if(p1!==p2){status($('loginStatus'),'Passwords do not match. Please request another reset link.',false);return;}
  try{
    const r=await client.auth.updateUser({password:p1});
    if(r.error)throw r.error;
    status($('loginStatus'),'Password changed successfully. Signing you in…',true);
    currentUser=session.user;showDash();
  }catch(e){status($('loginStatus'),e.message||String(e),false)}
});
'''
          if 'resetPasswordForEmail' not in s and marker2 in s:
              s = s.replace(marker2, marker2 + extra, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No admin changes needed."
          else
            git commit -m "Add secure admin password reset"
            git push
          fi
