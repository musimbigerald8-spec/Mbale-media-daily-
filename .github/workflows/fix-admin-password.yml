name: Add Mbale Media Admin Passkey

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-password.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add passkey option to admin dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '<button id="loginBtn" class="btn" style="width:100%">Sign in</button>'
          passkey = marker + '<a href="admin-passkey.html" class="btn" style="display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none;background:linear-gradient(135deg,#2563eb,#7c3aed)">👆 Fingerprint / Passkey</a><p style="text-align:center;color:#667085;font-size:12px;margin:10px 0 0">Use your device fingerprint, PIN, or passkey for secure sign-in.</p>'
          if 'href="admin-passkey.html"' not in s and marker in s:
              s = s.replace(marker, passkey, 1)
              p.write_text(s, encoding='utf-8')
              print('Passkey link added.')
          else:
              print('Passkey link already present or login marker not found.')
          PY

      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html
          if git diff --cached --quiet; then
            echo "No dashboard changes needed."
          else
            git commit -m "Add fingerprint passkey sign-in to admin dashboard"
            git push
          fi
