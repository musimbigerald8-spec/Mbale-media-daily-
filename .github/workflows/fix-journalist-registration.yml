name: Fix Journalist Registration Link

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix journalist account link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('journalist.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="account.html">Create an account</a>'
          new = '<a href="journalist-account.html">Create a Journalist Account</a>'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'href="journalist-account.html"' not in s:
              raise SystemExit('Expected journalist account link was not found; refusing to modify the file.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'Mbale Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add journalist.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix journalist account registration link [skip ci]'
            git push
          fi
