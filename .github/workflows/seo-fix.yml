name: Finish SEO metadata
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  seo:
    if: ${{ !contains(github.event.head_commit.message, '[seo-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish SEO metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          SITE='https://musimbigerald8-spec.github.io/Mbale-media-daily-/'
          LOGO=SITE+'ChatGPT%20Image%20Sep%2010,%202026,%2008_43_25%20AM.png'
          def clean(s):
              s=re.sub(r'<[^>]+>',' ',s or '')
              return re.sub(r'\s+',' ',html.unescape(s)).strip()
          def set_meta(text,name,content):
              pat=re.compile(r'<meta\s+name=["\']'+re.escape(name)+r'["\'][^>]*>',re.I)
              tag=f'<meta name="{name}" content="{html.escape(content,quote=True)}">'
              return pat.sub(tag,text) if pat.search(text) else text.replace('</head>',tag+'</head>',1)
          def set_prop(text,prop,content):
              pat=re.compile(r'<meta\s+property=["\']'+re.escape(prop)+r'["\'][^>]*>',re.I)
              tag=f'<meta property="{prop}" content="{html.escape(content,quote=True)}">'
              return pat.sub(tag,text) if pat.search(text) else text.replace('</head>',tag+'</head>',1)
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          t=set_meta(t,'description','Mbale Media Daily brings local news from Mbale and Eastern Uganda, plus Uganda, sports, business, health, agriculture and global news.')
          t=set_meta(t,'robots','index,follow,max-image-preview:large')
          t=set_prop(t,'og:title','Mbale Media Daily | Mbale & Eastern Uganda News')
          t=set_prop(t,'og:description','Local news from Mbale and Eastern Uganda, plus Uganda, sports, business, health, agriculture and global news.')
          t=set_prop(t,'og:type','website'); t=set_prop(t,'og:url',SITE); t=set_prop(t,'og:site_name','Mbale Media Daily'); t=set_prop(t,'og:image',LOGO)
          t=set_meta(t,'twitter:card','summary_large_image'); t=set_meta(t,'twitter:title','Mbale Media Daily | Mbale & Eastern Uganda News'); t=set_meta(t,'twitter:description','Local news from Mbale and Eastern Uganda, plus Uganda, sports, business, health, agriculture and global news.'); t=set_meta(t,'twitter:image',LOGO)
          p.write_text(t,encoding='utf-8')
          for p in Path('.').glob('article-*.html'):
              t=p.read_text(encoding='utf-8')
              tm=re.search(r'<title>(.*?)</title>',t,re.I|re.S)
              hm=re.search(r'<h1[^>]*>(.*?)</h1>',t,re.I|re.S)
              pm=re.search(r'<p[^>]*>(.*?)</p>',t,re.I|re.S)
              if not tm: continue
              title=clean(hm.group(1)) if hm else clean(tm.group(1)).split('|')[0].strip()
              desc=clean(pm.group(1)) if pm else title
              desc=desc[:155].rstrip()+('…' if len(desc)>155 else '')
              url=SITE+p.name
              t=set_meta(t,'description',desc); t=set_meta(t,'robots','index,follow,max-image-preview:large')
              if not re.search(r'<link\s+rel=["\']canonical["\']',t,re.I): t=t.replace('</head>',f'<link rel="canonical" href="{url}"></head>',1)
              t=set_prop(t,'og:title',title+' | Mbale Media Daily'); t=set_prop(t,'og:description',desc); t=set_prop(t,'og:type','article'); t=set_prop(t,'og:url',url); t=set_prop(t,'og:site_name','Mbale Media Daily'); t=set_prop(t,'og:image',LOGO)
              t=set_meta(t,'twitter:card','summary_large_image'); t=set_meta(t,'twitter:title',title+' | Mbale Media Daily'); t=set_meta(t,'twitter:description',desc); t=set_meta(t,'twitter:image',LOGO)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit SEO fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html article-*.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finish SEO metadata [seo-fix]'
          git push
