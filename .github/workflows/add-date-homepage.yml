name: Add date news navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-date-homepage.yml'
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add and fix date navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section class="section sports-spotlight"'
          if 'NEWS BY DATE' not in s and marker in s:
              section = '''<section class="section" id="date-news"><div class="section-head"><h2>NEWS BY DATE</h2><p class="tagline">Browse Mbale Media Daily by publication date</p></div><div class="news-grid"><article class="story"><div class="story-body"><div class="kicker">September 11, 2026</div><h3>Today's News</h3><p>Latest stories from Mbale, Eastern Uganda and Uganda.</p><a class="btn" href="category-2026-09-11.html">Open September 11 →</a></div></article><article class="story"><div class="story-body"><div class="kicker">September 10, 2026</div><h3>September 10 News</h3><p>Stories published and updated on September 10, 2026.</p><a class="btn" href="category-2026-09-10.html">Open September 10 →</a></div></article><article class="story"><div class="story-body"><div class="kicker">September 9, 2026</div><h3>September 9 News</h3><p>Stories published and updated on September 9, 2026.</p><a class="btn" href="category-2026-09-09.html">Open September 9 →</a></div></article><article class="story"><div class="story-body"><div class="kicker">September 8, 2026</div><h3>September 8 News</h3><p>Stories published and updated on September 8, 2026.</p><a class="btn" href="category-2026-09-08.html">Open September 8 →</a></div></article><article class="story"><div class="story-body"><div class="kicker">September 7, 2026</div><h3>September 7 News</h3><p>Stories published and updated on September 7, 2026.</p><a class="btn" href="category-2026-09-07.html">Open September 7 →</a></div></article><article class="story"><div class="story-body"><div class="kicker">September 3, 2026</div><h3>September 3 News</h3><p>Stories published and updated on September 3, 2026.</p><a class="btn" href="category-2026-09-03.html">Open September 3 →</a></div></article></div></section>'''
              s = s.replace(marker, section + marker, 1)
          for d in ['09-10','09-09','09-08','09-07','09-03']:
              s = s.replace(f'href="date-2026-{d}.html"', f'href="category-2026-{d}.html"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add date-based news navigation to homepage'
          git push