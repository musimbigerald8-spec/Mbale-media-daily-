name: Repair homepage logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  repair-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy official logo into assets
        run: |
          cp "ChatGPT Image Sep 10, 2026, 08_43_25 AM.png" "assets/mbale-media-daily-logo.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mbale-media-daily-logo.png
          git diff --cached --quiet || git commit -m "Fix homepage official logo asset"
          git push

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
