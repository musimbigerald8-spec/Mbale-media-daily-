name: Add site logo
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/add-logo.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add logo to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'class="site-logo"' in s:
              print('Logo already installed')
              raise SystemExit(0)
          s=s.replace('.mast{background:#fff;border-bottom:1px solid var(--line);padding:20px 5%}', '.mast{background:#fff;border-bottom:1px solid var(--line);padding:12px 5%}.brand-row{text-align:center}.site-logo{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 4px}.brand-row .tag{margin-top:0}')
          s=s.replace('<div class="logo">MBALE <b>MEDIA</b> DAILY</div><div class="tag">REAL STORIES • TRUSTED NEWS • EVERYDAY</div>', '<div class="brand-row"><img class="site-logo" src="logo.svg" alt="Mbale Media Daily logo"><div class="tag">REAL STORIES • TRUSTED NEWS • EVERYDAY</div></div>')
          s=s.replace('ChatGPT%20Image%20Sep%2010,%202026,%2008_43_25%20AM.png','logo.svg')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Mbale Media Daily logo to homepage' || exit 0
          git push
