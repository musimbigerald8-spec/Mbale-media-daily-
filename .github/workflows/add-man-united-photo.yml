name: Add Manchester United Sabah result photo

on:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add match photo and update pages
        env:
          IMAGE_B64: |
            REPLACE_B64
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          img = base64.b64decode(''.join('${{ env.IMAGE_B64 }}'.split()))
          Path('man-united-sabah-4-0.jpg').write_bytes(img)
          sports = Path('sports.html')
          s = sports.read_text()
          marker = '<div class="meta">September 10, 2026 • Old Trafford</div>'
          if marker in s and 'man-united-sabah-4-0.jpg' not in s:
              s = s.replace(marker, marker + '<img src="man-united-sabah-4-0.jpg" alt="Manchester United players celebrating after the 4-0 win over Sabah" class="match-photo">', 1)
          if '.match-photo' not in s:
              s = s.replace('</style>', '.match-photo{width:100%;height:360px;object-fit:cover;border-radius:9px;margin:18px 0}@media(max-width:700px){.match-photo{height:250px}}</style>', 1)
          sports.write_text(s)
          index = Path('index.html')
          h = index.read_text()
          insert = '''<section class="section" id="man-united-result"><div class="section-head"><h2>MANCHESTER UNITED • FULL TIME</h2><p class="tagline">Champions League • September 10, 2026</p></div><article class="story wide sports-feature"><img src="man-united-sabah-4-0.jpg" alt="Manchester United players celebrating their 4-0 Champions League win over Sabah"><div class="story-body"><div class="kicker">Manchester United • Champions League</div><h3>Manchester United beat Sabah 4–0 at Old Trafford</h3><p>Manchester United opened their Champions League campaign with a 4–0 victory over Sabah. Matheus Cunha, Bruno Fernandes, Benjamin Sesko and Lisandro Martínez scored for United. The result was confirmed after Thursday's match at Old Trafford. citeturn0news24turn0news25</p><div class="meta">September 10, 2026 • Old Trafford</div><a class="btn" href="article-man-united-sabah-4-0.html">Read Full Match Article →</a><div class="source">Photo supplied for Mbale Media Daily's match coverage. Match result verified against current reports.</div></div></article></section>'''
          marker2 = '<section class="section" id="date-news">'
          if 'id="man-united-result"' not in h:
              h = h.replace(marker2, insert + marker2, 1)
          index.write_text(h)
          article = Path('article-man-united-sabah-4-0.html')
          article.write_text('''<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manchester United beat Sabah 4-0 at Old Trafford in the Champions League on September 10, 2026."><link rel="canonical" href="https://musimbigerald8-spec.github.io/Mbale-media-daily-/article-man-united-sabah-4-0.html"><title>Manchester United beat Sabah 4–0 | Mbale Media Daily</title><style>body{margin:0;background:#f5f6f8;color:#17202a;font-family:Arial,sans-serif}.head{background:#071426;color:#fff;padding:24px 5%;text-align:center}.head h1{font:900 36px Georgia;margin:0}.head b{color:#e4032e}.wrap{max-width:900px;margin:auto;padding:28px 5% 60px}.back,.btn{display:inline-block;background:#e4032e;color:#fff;text-decoration:none;padding:11px 16px;border-radius:5px;font-weight:800}.article{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:25px;margin-top:20px}.article img{width:100%;height:520px;object-fit:cover;border-radius:9px}h2{font:900 38px/1.1 Georgia}p{font-size:18px;line-height:1.8;color:#303b46}.meta{color:#667085;border-bottom:1px solid #e5e7eb;padding-bottom:12px}@media(max-width:700px){.article img{height:330px}h2{font-size:30px}}</style></head><body><header class="head"><h1>MBALE <b>MEDIA</b> DAILY</h1><div>SPORTS DESK</div></header><main class="wrap"><a class="back" href="index.html">← Back to Home</a><article class="article"><div class="meta">September 10, 2026 • Old Trafford • UEFA Champions League</div><h2>Manchester United beat Sabah 4–0 on Champions League return</h2><img src="man-united-sabah-4-0.jpg" alt="Manchester United players celebrating after beating Sabah 4-0"><p>Manchester United made a winning return to the Champions League with a 4–0 victory over Sabah at Old Trafford on September 10, 2026.</p><p>Matheus Cunha opened the scoring, Bruno Fernandes added a second, Benjamin Sesko made it 3–0 and Lisandro Martínez completed the scoring. citeturn0news24turn0news25</p><p>The result gives United a strong start in Europe as they prepare for their next major fixture, the Manchester derby.</p><div class="meta">Mbale Media Daily Sports Desk • Match result verified from current reports.</div></article></main></body></html>''')
          hub = Path('articles.html')
          a = hub.read_text()
          card = '<div class="card"><a href="article-man-united-sabah-4-0.html">Manchester United beat Sabah 4–0 on Champions League return</a><p>Sport • Manchester United • September 10, 2026</p></div>'
          if 'article-man-united-sabah-4-0.html' not in a:
              a = a.replace('<div class="card"><a href="article-tooro-succession-latest.html">', card + '<div class="card"><a href="article-tooro-succession-latest.html">', 1)
          hub.write_text(a)
          sm = Path('sitemap.xml')
          if sm.exists():
              x = sm.read_text()
              url = '<url><loc>https://musimbigerald8-spec.github.io/Mbale-media-daily-/article-man-united-sabah-4-0.html</loc><lastmod>2026-09-11</lastmod><changefreq>daily</changefreq><priority>0.9</priority></url>'
              if 'article-man-united-sabah-4-0.html' not in x:
                  x = x.replace('</urlset>', url + '</urlset>')
                  sm.write_text(x)
          PY
      - name: Commit website changes
        run: |
          git config user.name "Mbale Media Daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add man-united-sabah-4-0.jpg index.html sports.html article-man-united-sabah-4-0.html articles.html sitemap.xml
          git commit -m "Add Manchester United 4-0 Sabah match photo and article"
          git push
