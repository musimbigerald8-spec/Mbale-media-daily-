name: Finalize Mbale Media Main Menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fix main menu links permanently
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="admin.html"', 'href="admin-dashboard.html"')
          s = s.replace('href="./admin.html"', 'href="./admin-dashboard.html"')
          s = s.replace('href="/admin.html"', 'href="/admin-dashboard.html"')
          s = s.replace('href="journalist.html"', 'href="journalist.html?v=20260915"')
          s = s.replace('href="./journalist.html"', 'href="./journalist.html?v=20260915"')
          s = s.replace('href="/journalist.html"', 'href="/journalist.html?v=20260915"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize Admin and Journalist menu links"
          git push
