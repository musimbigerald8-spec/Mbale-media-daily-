name: Keep SEO URLs on root GitHub Pages domain

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Normalize canonical and public URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'https://musimbigerald8-spec.github.io/Mbale-media-daily-'
          new = 'https://musimbigerald8-spec.github.io'
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.xml', '.txt', '.json'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Normalized:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit normalized SEO URLs
        run: |
          git config user.name "Mbale Media Daily SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*.xml' '*.txt' '*.json' || true
          if git diff --cached --quiet; then
            echo "No SEO URL changes needed."
          else
            git commit -m "Fix canonical, sitemap and public SEO URLs"
            git push
          fi
