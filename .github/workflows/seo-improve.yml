name: Improve SEO metadata
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  seo:
    if: ${{ !contains(github.event.head_commit.message, '[seo-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve SEO metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html, json

          SITE = 'https://musimbigerald8-spec.github.io/Mbale-media-daily-/'
          LOGO = SITE + 'ChatGPT%20Image%20Sep%2010,%202026,%2008_43_25%20AM.png'

          def clean(s):
              s = re.sub(r'<[^>]+>', ' ', s or '')
              s = html.unescape(s)
              return re.sub(r'\s+', ' ', s).strip()

          def esc(s):
              return html.escape(s, quote=True)

          def replace_meta(head, name, content):
              pat = re.compile(r'<meta\s+name=["\']' + re.escape(name) + r'["\'][^>]*>', re.I)
              tag = f'<meta name="{name}" content="{esc(content)}">'
              return pat.sub(tag, head) if pat.search(head) else head.replace('</head>', tag + '</head>')

          def replace_prop(head, prop, content):
              pat = re.compile(r'<meta\s+property=["\']' + re.escape(prop) + r'["\'][^>]*>', re.I)
              tag = f'<meta property="{prop}" content="{esc(content)}">'
              return pat.sub(tag, head) if pat.search(head) else head.replace('</head>', tag + '</head>')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          head_end = text.lower().find('</head>')
          head = text[:head_end] if head_end >= 0 else text
          body = text[head_end:] if head_end >= 0 else ''
          head = re.sub(r'<title>.*?</title>', '<title>Mbale Media Daily | Mbale & Eastern Uganda News</title>', head, flags=re.I|re.S)
          head = replace_meta(head, 'description', 'Mbale Media Daily brings local news from Mbale and Eastern Uganda, plus Uganda, sports, business, health, agriculture and global news.')
          head = replace_meta(head, 'robots', 'index,follow,max-image-preview:large')
          if not re.search(r'<link\s+rel=["\']canonical["\']', head, re.I):
              head += '<link rel="canonical" href="' + SITE + '">'
          head = replace_prop(head, 'og:title', 'Mbale Media Daily | Mbale & Eastern Uganda News')
          head = replace_prop(head, 'og:description', 'Local news from Mbale and Eastern Uganda, plus Uganda, sports, business, health, agriculture and global news.')
          head = replace_prop(head, 'og:type', 'website')
          head = replace_prop(head, 'og:url', SITE)
          head = replace_prop(head, 'og:site_name', 'Mbale Media Daily')
          head = replace_prop(head, 'og:image', LOGO)
          head = replace_meta(head, 'twitter:card', 'summary_large_image')
          head = replace_meta(head, 'twitter:title', 'Mbale Media Daily | Mbale & Eastern Uganda News')
          head = replace_meta(head, 'twitter:description', 'Local news from Mbale and Eastern Uganda, plus Uganda, sports, business, health, agriculture and global news.')
          head = replace_meta(head, 'twitter:image', LOGO)
          schema = {'@context':'https://schema.org','@graph':[{'@type':'NewsMediaOrganization','@id':SITE+'#organization','name':'Mbale Media Daily','url':SITE,'logo':{'@type':'ImageObject','url':LOGO},'email':'Mbalemediadailymbale@gmail.com'},{'@type':'WebSite','@id':SITE+'#website','url':SITE,'name':'Mbale Media Daily','publisher':{'@id':SITE+'#organization'}}]}
          if 'application/ld+json' not in head:
              head += '<script type="application/ld+json">' + json.dumps(schema, ensure_ascii=False, separators=(',',':')) + '</script>'
          p.write_text(head + body, encoding='utf-8')

          for p in sorted(Path('.').glob('article-*.html')):
              text = p.read_text(encoding='utf-8')
              m = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
              if not m:
                  continue
              title = clean(m.group(1))
              article_title = title.split('|',1)[0].strip() if '|' in title else title
              h = re.search(r'<h1[^>]*>(.*?)</h1>', text, re.I|re.S)
              article_title = clean(h.group(1)) if h else article_title
              pm = re.search(r'<p[^>]*>(.*?)</p>', text, re.I|re.S)
              desc = clean(pm.group(1)) if pm else article_title
              desc = desc[:155].rstrip() + ('…' if len(desc) > 155 else '')
              url = SITE + p.name
              head_end = text.lower().find('</head>')
              if head_end < 0:
                  continue
              head, body = text[:head_end], text[head_end:]
              head = replace_meta(head, 'description', desc)
              head = replace_meta(head, 'robots', 'index,follow,max-image-preview:large')
              if not re.search(r'<link\s+rel=["\']canonical["\']', head, re.I):
                  head += f'<link rel="canonical" href="{url}">'
              head = replace_prop(head, 'og:title', article_title + ' | Mbale Media Daily')
              head = replace_prop(head, 'og:description', desc)
              head = replace_prop(head, 'og:type', 'article')
              head = replace_prop(head, 'og:url', url)
              head = replace_prop(head, 'og:site_name', 'Mbale Media Daily')
              head = replace_prop(head, 'og:image', LOGO)
              head = replace_meta(head, 'twitter:card', 'summary_large_image')
              head = replace_meta(head, 'twitter:title', article_title + ' | Mbale Media Daily')
              head = replace_meta(head, 'twitter:description', desc)
              head = replace_meta(head, 'twitter:image', LOGO)
              article_schema = {'@context':'https://schema.org','@type':'NewsArticle','headline':article_title,'description':desc,'mainEntityOfPage':{'@type':'WebPage','@id':url},'url':url,'author':{'@type':'Organization','name':'Mbale Media Daily'},'publisher':{'@type':'NewsMediaOrganization','name':'Mbale Media Daily','url':SITE,'logo':{'@type':'ImageObject','url':LOGO}}}
              if 'application/ld+json' not in head:
                  head += '<script type="application/ld+json">' + json.dumps(article_schema, ensure_ascii=False, separators=(',',':')) + '</script>'
              p.write_text(head + body, encoding='utf-8')
          PY
      - name: Commit SEO changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html article-*.html
          git diff --cached --quiet && exit 0
          git commit -m 'Improve SEO metadata [seo-bot]'
          git push
