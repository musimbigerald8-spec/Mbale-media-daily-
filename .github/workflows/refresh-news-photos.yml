name: Refresh Mbale Media news photos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Refresh homepage news photos and professional sports layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          photos = {
              "Two retired UPDF generals detained as intelligence probe widens": (
                  "https://www.kigalitoday.com/IMG/png/major_general_abel_kandiho.png",
                  "Retired Major General Abel Kandiho of Uganda's UPDF"
              ),
              "Coffee seedlings dry up in Katakwi as farmers question planting timing": (
                  "https://newvision-media.s3.amazonaws.com/cms/b5fa16dc-5033-49ed-85e8-c02da9f8b217.jpg",
                  "Coffee seedlings in a Ugandan nursery"
              ),
              "Bukedea traders demand clearer cattle-market charges": (
                  "https://www.monitor.co.ug/resource/blob/4608546/a5a255870afed1f4da1800cde95623e1/reg02pix-data.jpg",
                  "Ugandan cattle market"
              ),
              "Joshua Cheptegei returns to Uganda's national athletics programme": (
                  "https://sportal365images.com/process/smp-images-production/ringier.africa/03082024/9ebd024d-8c88-41fe-9e06-c05566a03549.jpeg?operations=fit%281200%3A630%29",
                  "Joshua Cheptegei celebrating for Uganda"
              ),
              "Uganda and African Union discuss stronger action on food insecurity": (
                  "https://au.int/sites/default/files/styles/full/public/pressreleases/44368-CAADP-CP.jpeg?itok=q1o3aHs0",
                  "African Union agriculture and food security summit in Kampala"
              ),
              "Mbale police officers urged to strengthen dialogue and discipline": (
                  "https://dailyexpress.co.ug/wp-content/uploads/2025/05/Mbale-Northern-Division-Appeals-for-Police-Patrol-Vehicle.jpg",
                  "Police officers and community members in Mbale"
              ),
          }

          for title, (url, alt) in photos.items():
              pattern = r'(<article class="story">)(?=<div class="story-body">)(.*?<h3>' + re.escape(title) + r'</h3>)'
              replacement = r'\1<img src="' + url + r'" alt="' + alt + r'">\2'
              html, n = re.subn(pattern, replacement, html, count=1, flags=re.S)

          sports_anchor = '<section class="section" id="sports"><div class="section-head"><h2>SPORTS</h2></div>'
          sports_features = '''<article class="story sports-feature"><img src="https://mufc-live.cdn.scayle.cloud/images/c29b1c29c6b813e07ca5d6629b3b0765.jpg?quality=75" alt="Bruno Fernandes in the Manchester United 2026/27 home jersey"><div class="story-body"><div class="kicker">Manchester United • Bruno Fernandes</div><h3>Bruno Fernandes leads Manchester United into another big week</h3><p>Bruno Fernandes remains one of Manchester United's key leaders as the club prepares for its UEFA Champions League opener against Sabah and the Manchester derby. Fernandes scored three times and assisted once in United's 5–2 comeback win over Ipswich Town.</p><div class="meta">September 10, 2026 • Manchester United</div><a class="btn" href="sports.html">Read Full Story →</a><div class="source">Photo: Manchester United Store. Current football information checked against recent 2026/27 reports.</div></div></article><article class="story sports-feature"><img src="https://store.f.image.geki.jp/upload/save_image/ib5290-100_9.jpg" alt="Marcus Rashford in England's 2026 home shirt"><div class="story-body"><div class="kicker">Manchester United • Marcus Rashford</div><h3>Marcus Rashford back in Manchester United's attacking plans</h3><p>Marcus Rashford has returned to Manchester United's first-team plans after his loan spell at Barcelona and has started the club's last two Premier League matches. He played 70 minutes against Everton on September 6 before being substituted with a minor knock.</p><div class="meta">September 10, 2026 • Manchester United</div><a class="btn" href="sports.html">Read Full Story →</a><div class="source">Photo: 2026 England replica-kit image featuring Marcus Rashford. Current match information checked against recent football reports.</div></div></article>'''

          if 'Bruno Fernandes leads Manchester United into another big week' not in html and sports_anchor in html:
              html = html.replace(sports_anchor, sports_anchor + '<div class="news-grid">' + sports_features, 1)

          spotlight = '''<section class="section sports-spotlight" id="sports-spotlight"><div class="section-head"><h2>SPORTS SPOTLIGHT</h2><p class="tagline">Manchester United • Bruno Fernandes & Marcus Rashford</p></div><div class="sports-spotlight-grid"><article class="spotlight-card"><img src="https://mufc-live.cdn.scayle.cloud/images/c29b1c29c6b813e07ca5d6629b3b0765.jpg?quality=75" alt="Bruno Fernandes"><div class="spotlight-body"><div class="kicker">Manchester United • Bruno Fernandes</div><h3>Bruno Fernandes leads Manchester United into another big week</h3><p>Bruno Fernandes remains a key leader as Manchester United prepares for its Champions League opener and the Manchester derby.</p><a class="btn" href="sports.html">Read Bruno's Story →</a></div></article><article class="spotlight-card"><img src="https://store.f.image.geki.jp/upload/save_image/ib5290-100_9.jpg" alt="Marcus Rashford"><div class="spotlight-body"><div class="kicker">Manchester United • Marcus Rashford</div><h3>Marcus Rashford back in Manchester United's attacking plans</h3><p>Rashford has returned to Manchester United's first-team plans and is back among the club's attacking options.</p><a class="btn" href="sports.html">Read Rashford's Story →</a></div></article></div></section>'''

          if 'id="sports-spotlight"' not in html:
              hero_end = '</section><section class="section" id="latest">'
              html = html.replace(hero_end, '</section>' + spotlight + '<section class="section" id="latest">', 1)

          html = re.sub(r'<section class="match-banner">.*?</section>', '', html, count=1, flags=re.S)

          css = '.sports-spotlight{margin-top:10px}.sports-spotlight .section-head{margin-bottom:18px}.sports-spotlight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.spotlight-card{background:#fff;border:2px solid var(--navy);border-top:5px solid var(--red);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px #00000018}.spotlight-card img{width:100%;height:280px;object-fit:cover;display:block}.spotlight-body{padding:22px}.spotlight-body h3{font:700 30px/1.12 Georgia;margin:8px 0 12px}.spotlight-body p{color:#46515c;font-size:15px;line-height:1.65}@media(max-width:700px){.sports-spotlight-grid{grid-template-columns:1fr}.spotlight-card img{height:240px}.spotlight-body h3{font-size:25px}}'
          if '.sports-spotlight{' not in html.split('</style>',1)[0]:
              html = html.replace('.sports-feature{border-top:4px solid var(--red)}', '.sports-feature{border-top:4px solid var(--red)}' + css, 1)

          # Make the supplied logo prominent and prevent the old cached/undersized rendering.
          html = html.replace('.mast{background:#fff;border-bottom:1px solid var(--line);padding:12px 5%}.brand-row{text-align:center}.site-logo{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 4px}.brand-row .tag{margin-top:0}', '.mast{background:#fff;border-bottom:4px solid var(--red);padding:10px 5% 14px}.brand-row{text-align:center}.site-logo{width:260px;height:260px;object-fit:contain;display:block;margin:0 auto 2px;filter:drop-shadow(0 5px 8px #0003)}.brand-row .tag{margin-top:0;font-weight:800}')
          html = html.replace('<img class="site-logo" src="logo.svg" alt="Mbale Media Daily logo">', '<img class="site-logo" src="logo.svg?v=4" alt="Mbale Media Daily logo">')
          html = html.replace('@media(max-width:700px){.top{font-size:10px}', '@media(max-width:700px){.site-logo{width:235px;height:235px}.top{font-size:10px}')

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit photo and layout updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No homepage changes needed" && exit 0
          git commit -m "Improve homepage logo visibility"
          git push
