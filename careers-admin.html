<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mbale Media • Careers Applications</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 6px 20px #17203312}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;background:#172554;color:#fff;font-weight:800;cursor:pointer}.btn.green{background:#15803d}.btn.red{background:#b91c1c}.btn.gold{background:#b45309}.muted{color:#667085}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#e0e7ff;font-weight:800;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.err{color:#b00020;font-weight:700}.ok{color:#15803d;font-weight:700}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #071426;outline-offset:3px}</style></head><body><div class="wrap"><div class="top"><div><h1>💼 Careers Applications</h1><p class="muted">Review internship and volunteer applications for Mbale Media Daily.</p></div><div><a class="btn" href="admin-dashboard.html" style="text-decoration:none;display:inline-block">← Admin Dashboard</a></div></div><div id="status" class="card muted">Checking administrator access…</div><div id="list"></div></div><script>const SUPABASE_URL='https://dwbgcaxwemrwheybdpya.supabase.co';const SUPABASE_KEY=window.MBMD_SUPABASE_KEY||'sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8';const ADMIN_UID='81148dcd-10b8-4f85-a2b0-635fc7c250cf';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const statusEl=document.getElementById('status'),listEl=document.getElementById('list');function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function msg(t,ok=false){statusEl.className='card '+(ok?'ok':'err');statusEl.textContent=t}async function boot(){const {data:{session}}=await client.auth.getSession();if(!session||session.user.id!==ADMIN_UID){msg('Administrator access required. Please sign in as the main administrator first.',false);return}msg('Administrator access confirmed. Loading applications…',true);await load()}async function load(){const {data,error}=await client.from('career_applications').select('*').order('created_at',{ascending:false});if(error){msg(error.message,false);return}if(!data.length){listEl.innerHTML='<div class="card">No applications yet.</div>';return}listEl.innerHTML=data.map(a=>`<div class="card"><div class="top"><div><h2>${esc(a.full_name)}</h2><div>${esc(a.email)}${a.phone?' • '+esc(a.phone):''}</div></div><span class="badge">${esc(a.opportunity_type)}</span></div><p><strong>Education:</strong> ${esc(a.education||'Not provided')}</p><p><strong>Skills:</strong> ${esc(a.skills||'Not provided')}</p><p><strong>Motivation:</strong><br>${esc(a.motivation)}</p><p class="muted">Applied: ${new Date(a.created_at).toLocaleString()} • Status: <strong>${esc(a.status)}</strong> • Certificate: <strong>${a.certificate_awarded?'Awarded':'Not awarded'}</strong></p><div class="row"><button class="btn" onclick="setStatus('${a.id}','accepted')">Accept</button><button class="btn red" onclick="setStatus('${a.id}','rejected')">Reject</button><button class="btn green" onclick="setStatus('${a.id}','completed')">Mark Completed</button><button class="btn gold" onclick="cert('${a.id}',${!a.certificate_awarded})">${a.certificate_awarded?'Revoke Certificate':'Award Certificate'}</button></div></div>`).join('')}async function setStatus(id,status){const {error}=await client.from('career_applications').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){msg(error.message,false);return}msg('Application updated successfully.',true);await load()}async function cert(id,value){const {error}=await client.from('career_applications').update({certificate_awarded:value,updated_at:new Date().toISOString()}).eq('id',id);if(error){msg(error.message,false);return}msg(value?'Certificate marked as awarded.':'Certificate marked as not awarded.',true);await load()}window.setStatus=setStatus;window.cert=cert;boot()</script><script src="assets/mbale-media-ai.js" defer></script>
</body></html>
