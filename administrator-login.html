<style>
body{margin:0;background:#071426;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#fff;color:#17202a;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 20px 60px #0006}.logo{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 12px}.box h1{text-align:center;font:900 25px Georgia;margin:0 0 6px}.sub{text-align:center;color:#667085;font-size:13px;margin:0 0 22px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:#e4032e;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.btn.alt{background:#10284a}.status{min-height:20px;font-size:12px;font-weight:700;line-height:1.5;margin-top:12px}.note{background:#eef6ff;border:1px solid #c9def7;border-radius:9px;padding:12px;font-size:12px;line-height:1.5;margin-top:15px}.small{text-align:center;font-size:11px;color:#667085;margin-top:18px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #071426;outline-offset:3px}</style>

<body>

<p class="sub">Mbale Media Daily • restricted newsroom control</p>
<div class="field"><label>Administrator email</label><input id="email" type="email" value="musimbigerald8@gmail.com" autocomplete="email"></div>

</main>
<script>
const DB_URL='https://dwbgcaxwemrwheybdpya.supabase.co';
const DB_KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8';
const ADMIN='81148dcd-10b8-4f85-a2b0-635fc7c250cf';
const TARGET='administrator-dashboard-v2.html';
