<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Mbale Media Daily</title><style>body{margin:0;background:#f5f6f8;color:#17202a;font-family:Arial,sans-serif}.head{background:#071426;color:#fff;padding:24px 5%;text-align:center}.head h1{font:900 34px Georgia;margin:0}.head b{color:#e4032e}.wrap{max-width:950px;margin:auto;padding:28px 5% 60px}.back,.btn{display:inline-block;background:#e4032e;color:#fff;text-decoration:none;padding:11px 16px;border-radius:5px;font-weight:800}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;padding:14px;border:1px solid #ccd3dc;border-radius:6px;font-size:16px}.search button{background:#071426;color:#fff;border:0;border-radius:6px;padding:0 20px;font-weight:800}.result{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px;margin:14px 0}.result h2{font:700 25px Georgia;margin:0 0 8px}.result a{color:#e4032e;font-weight:800;text-decoration:none}.muted{color:#667085}@media(max-width:600px){.search{display:block}.search button{height:45px;margin-top:8px;width:100%}}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #071426;outline-offset:3px}</style></head><body><header class="head"><h1>MBALE <b>MEDIA</b> DAILY</h1><div>SEARCH THE NEWSROOM</div></header><main class="wrap"><a class="back" href="index.html">← Home</a><div class="search"><input id="q" placeholder="Search Mbale Media news..."><button onclick="go()">Search</button></div><p class="muted">Search detailed stories by topic, place or headline.</p><div id="results"></div></main><script>const stories=[['Tooro succession dispute deepens after King Oyo’s death','Tooro, succession, King Oyo, monarchy, national','news.html#king-oyo'],['Mbale police officers urged to strengthen dialogue and discipline','Mbale, police, community, discipline','news.html#police'],['Mushroom growing gives Mbale women a new route to income','Mbale, mushrooms, women, agriculture','news.html#mushrooms'],['Eastern Uganda seeks to revive cotton farming','Eastern Uganda, cotton, agriculture','news.html#cotton'],['Bukedi communities see progress in the fight against malaria','Bukedi, malaria, health','news.html#malaria'],['Dry conditions put pressure on farmers and families','Uganda, climate, drought, agriculture','news.html#climate'],['Mbale businesses prepare for World Tourism Day opportunities','Mbale, tourism, business','news.html#tourism'],['Busitema University focuses on results, accountability and impact','Busitema, education, research','news.html#busitema']];function go(){let q=document.getElementById('q').value.toLowerCase().trim();let r=stories.filter(s=>(s[0]+' '+s[1]).toLowerCase().includes(q));document.getElementById('results').innerHTML=r.length?r.map(s=>`<div class="result"><h2>${s[0]}</h2><p class="muted">${s[1]}</p><a href="${s[2]}">Read full article →</a></div>`).join(''):'<div class="result"><h2>No matching story</h2><p>Try Mbale, agriculture, health, tourism, police, cotton or Tooro.</p></div>'}go();document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script><script src="assets/mbale-media-ai.js" defer></script>
