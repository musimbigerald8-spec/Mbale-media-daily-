<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>Mbale Media Daily | Full Story</title>
<style>
:root{--navy:#071426;--red:#e4032e;--gold:#d4af37;--paper:#f5f6f8;--ink:#17202a;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:9px 5%;font-size:12px;display:flex;justify-content:space-between}.mast{background:#fff;border-bottom:4px solid var(--red);padding:10px 5%}.brand{max-width:1100px;margin:auto;text-align:center}.brand h1{font:900 42px Georgia;margin:0}.brand p{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted)}nav{background:var(--navy);text-align:center}nav a{display:inline-block;color:#fff;text-decoration:none;padding:13px 16px;font-weight:800;font-size:13px}.wrap{max-width:900px;margin:30px auto;padding:0 20px}.back{display:inline-block;color:var(--navy);font-weight:800;text-decoration:none;margin-bottom:20px}.article{background:#fff;padding:30px;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0001}.kicker{color:var(--red);font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.article h2{font:900 clamp(34px,6vw,58px)/1.05 Georgia;margin:10px 0 12px}.meta{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}.lead{font:700 20px/1.6 Georgia;margin:20px 0}.body{font:18px/1.8 Georgia}.body p{margin:0 0 20px}.story-image{width:100%;max-height:520px;object-fit:cover;border-radius:8px;margin:10px 0 20px}.actions{border-top:1px solid var(--line);margin-top:25px;padding-top:18px;display:flex;gap:10px;flex-wrap:wrap}.actions button,.actions a{background:var(--red);color:#fff;border:0;padding:11px 15px;border-radius:5px;text-decoration:none;font-weight:800;cursor:pointer}.notice{background:#fff3cd;border:1px solid #e0a800;padding:15px;border-radius:7px;margin-top:20px;font-size:13px}.footer{background:#050d18;color:#cbd5e1;text-align:center;padding:35px 20px;margin-top:40px;font-size:12px}@media(max-width:600px){.top{font-size:10px}.brand h1{font-size:34px}.article{padding:20px;border-radius:0;border-left:0;border-right:0}.wrap{padding:0;margin-top:15px}.body{font-size:17px}.lead{font-size:18px}nav a{padding:10px 9px;font-size:11px}}
</style>
</head>
<body>
<div class="top"><span>Mbale Media Daily • Eastern Uganda • Uganda</span><span>Every Story Matters</span></div>
<header class="mast"><div class="brand"><h1>Mbale Media Daily</h1><p>REAL STORIES • TRUSTED NEWS • EVERYDAY</p></div></header>
<nav><a href="index.html">Home</a><a href="index.html#latest">Latest News</a><a href="index.html#mbale">Mbale</a><a href="index.html#national">National</a><a href="index.html#sports">Sports</a><a href="index.html#global">Global</a></nav>
<main class="wrap"><a class="back" href="index.html">← Back to Mbale Media Daily</a><article class="article" id="reader"><p>Loading story…</p></article></main>
<footer class="footer">© 2026 Mbale Media Daily • The Voice of Eastern Uganda</footer>
<script>
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function render(){
 const q=new URLSearchParams(location.search).get('id');
 const raw=localStorage.getItem('mbaleArticle_'+q);
 const reader=document.getElementById('reader');
 if(!raw){reader.innerHTML='<h2>Story not found</h2><p>This article link is no longer available in this browser. Return to the homepage and open the story again.</p><a class="actions" href="index.html">Return home</a>';return;}
 try{
  const a=JSON.parse(raw);
  document.title=(a.title||'Full Story')+' | Mbale Media Daily';
  const text=(a.text||'').trim();
  const paragraphs=text.split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');
  reader.innerHTML='<div class="kicker">'+esc(a.category||'NEWS')+'</div><h2>'+esc(a.title||'Mbale Media Daily Story')+'</h2><div class="meta">'+esc(a.meta||'Mbale Media Daily')+'</div>'+(a.image?'<img class="story-image" src="'+esc(a.image)+'" alt="'+esc(a.title)+'">':'')+'<div class="lead">'+esc(a.lead||'Read the full story from Mbale Media Daily.')+'</div><div class="body">'+paragraphs+'</div><div class="actions"><button onclick="shareStory()">↗ Share Story</button><button onclick="copyStory()">Copy Link</button><a href="index.html">More News</a></div><div class="notice">Editorial note: Mbale Media Daily should verify and attribute facts before publication. This reader displays the story content supplied by the homepage.</div>';
 }catch(e){reader.innerHTML='<h2>Unable to open story</h2><p>Please return to the homepage and try again.</p>';}
}
function shareStory(){if(navigator.share){navigator.share({title:document.title,url:location.href})}else{navigator.clipboard.writeText(location.href);alert('Article link copied.');}}
function copyStory(){navigator.clipboard.writeText(location.href).then(()=>alert('Article link copied.'));}
render();
</script>
</body>
</html>
