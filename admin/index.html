<html lang="en">
<head>

<style>
:root{--bg:#071016;--panel:#0d171e;--panel2:#111e26;--line:#20313b;--text:#edf4f7;--muted:#8ea0aa;--red:#e4032e;--gold:#d8ad5c;--green:#29c58b;--blue:#56a8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050a0e,#09141b 55%,#070d12);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:rgba(13,23,30,.96);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 30px 80px #0008}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:12px;background:var(--red);display:grid;place-items:center;font-weight:1000}.brand h1{font:800 22px Georgia;margin:0}.brand small{color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}input,select,textarea{width:100%;background:#081118;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;outline:none}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--red);color:white;font-weight:800}.btn.secondary{background:#1a2932}.btn.green{background:#168a64}.btn.gold{background:#9d762d}.btn.danger{background:#a90b29}.error{color:#ff8f9f;margin-top:12px;font-size:13px}.shell{display:flex;min-height:100vh}.side{width:245px;background:#050b0f;border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;overflow:auto}.side .brand{margin-bottom:20px}.navbtn{width:100%;text-align:left;background:transparent;color:#aebdc5;border:0;border-radius:9px;padding:11px 12px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#14212a;color:white}.navgroup{font-size:10px;color:#5f727d;text-transform:uppercase;letter-spacing:1.2px;margin:18px 12px 6px}.main{margin-left:245px;width:calc(100% - 245px);padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.top h2{margin:0;font:800 28px Georgia}.userbox{color:var(--muted);font-size:12px;text-align:right}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel{background:linear-gradient(180deg,#0e1a22,#0a141a);border:1px solid var(--line);border-radius:14px;padding:17px}.stat b{font-size:30px;display:block}.stat span{color:var(--muted);font-size:12px}.panel{margin-top:16px}.panel h3{margin:0 0 14px;font:800 18px Georgia}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar>*{width:auto}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{border-bottom:1px solid #1b2a33;padding:10px 8px;text-align:left;font-size:12px;vertical-align:top}.table th{color:#9eb0b9;font-size:10px;text-transform:uppercase;letter-spacing:.8px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#182832;color:#b9c9d1;font-size:10px;margin:2px}.badge.red{background:#4a1020;color:#ff9db0}.badge.green{background:#0d3c2f;color:#78edc1}.badge.gold{background:#4a391b;color:#f1d28a}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.check{display:flex;align-items:center;gap:8px;background:#09131a;border:1px solid var(--line);padding:10px;border-radius:9px}.check input{width:auto}.toast{position:fixed;right:20px;bottom:20px;background:#10232c;border:1px solid var(--line);padding:12px 15px;border-radius:10px;z-index:50}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.dangerline{border-color:#5a1827}.small{font-size:11px}.search{max-width:360px}@media(max-width:900px){.side{width:72px;padding:10px}.side .brand h1,.side .brand small,.navbtn span,.navgroup{display:none}.navbtn{text-align:center}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.top{align-items:flex-start}.top h2{font-size:22px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.userbox{text-align:left}}
</style></head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">MM</div><div><h1>Mbale Media Daily</h1><small>Private Newsroom Administration</small></div></div><p class="muted">This portal is for authorized newsroom staff only. It is not part of the public website.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:16px" id="loginBtn">Sign in</button><div id="loginError" class="error"></div></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><div class="logo">MM</div><div><h1>Newsroom</h1><small>Private</small></div></div><div class="navgroup">Control Center</div><button class="navbtn active" data-view="dashboard">▣ <span>Dashboard</span></button><button class="navbtn" data-view="articles">▤ <span>Articles</span></button><button class="navbtn" data-view="review">✓ <span>Review Queue</span></button><button class="navbtn" data-view="homepage">⌂ <span>Homepage Manager</span></button><div class="navgroup">Structure</div><button class="navbtn" data-view="categories">▦ <span>Categories</span></button><button class="navbtn" data-view="tags"># <span>Tags</span></button><div class="navgroup">People & Media</div><button class="navbtn" data-view="staff">♙ <span>Staff & Roles</span></button><button class="navbtn" data-view="journalists">✎ <span>Journalists</span></button><button class="navbtn" data-view="media">▶ <span>Media Manager</span></button><button class="navbtn" data-view="ads">▤ <span>Ads Manager</span></button><div class="navgroup">System</div><button class="navbtn" data-view="analytics">◔ <span>Analytics</span></button><button class="navbtn" data-view="settings">⚙ <span>Site Settings</span></button><button class="navbtn" data-view="trash">♲ <span>Trash</span></button><button class="navbtn" id="logout">↪ <span>Sign out</span></button></aside><main class="main"><div class="top"><h2 id="viewTitle">Dashboard</h2><div class="userbox" id="userBox"></div></div><div id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://dwbgcaxwemrwheybdpya.supabase.co';
const SUPABASE_KEY='sb_publishable_WkkWUJF8ONyX4oS2nvGNFw_jdAob8M8';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, role=null, allowedCats=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)};
const q=(s,p={})=>sb.from(s).select(p.select||'*',p);
async function getRole(){if(!me)return null;let r=await sb.from('editor_roles').select('role,full_name,email,active').eq('user_id',me.id).maybeSingle();if(r.error)throw r.error;if(!r.data||!r.data.active)return null;role=r.data.role;let a=await sb.from('editor_category_access').select('category_id').eq('editor_id',me.id);allowedCats=(a.data||[]).map(x=>x.category_id);return r.data}
function canAdmin(){return role==='admin'}
function canEdit(){return ['admin','editor','category_editor'].includes(role)}
function catsOptions(list,withBlank=true){return (withBlank?'<option value="">— Select category —</option>':'')+list.map(c=>'<option value="'+c.id+'">'+esc(c.parent_id?'↳ '+c.name:c.name)+'</option>').join('')}
async function loadCats(){let r=await sb.from('categories').select('*').order('sort_order').order('name');if(r.error)throw r.error;return r.data||[]}
async function loadTags(){let r=await sb.from('tags').select('*').order('name');if(r.error)throw r.error;return r.data||[]}
async function loadNews(limit=100){let r=await sb.from('news').select('id,title,slug,excerpt,category,category_id,subcategory_id,author,author_id,featured,breaking,trending,sponsored,published,approval_status,created_at,updated_at,deleted_at').order('created_at',{ascending:false}).limit(limit);if(r.error)throw r.error;return r.data||[]}
async function dashboard(){const [n,c,j,a]=await Promise.all([loadNews(200),loadCats(),sb.from('journalist_submissions').select('id,status').in('status',['pending','changes_requested']),sb.from('advertisements').select('id').eq('active',true)]);const published=n.filter(x=>x.published&&!x.deleted_at).length,trash=n.filter(x=>x.deleted_at).length,pending=(j.data||[]).length;document.getElementById('content').innerHTML='<div class="grid"><div class="stat"><b>'+published+'</b><span>Published articles</span></div><div class="stat"><b>'+pending+'</b><span>Review queue</span></div><div class="stat"><b>'+c.length+'</b><span>Categories & subcategories</span></div><div class="stat"><b>'+trash+'</b><span>Trash</span></div></div><div class="panel"><h3>Newsroom status</h3><div class="three"><div><b>Breaking</b><p class="muted">'+n.filter(x=>x.breaking&&!x.deleted_at).length+' active stories</p></div><div><b>Featured</b><p class="muted">'+n.filter(x=>x.featured&&!x.deleted_at).length+' active stories</p></div><div><b>Trending</b><p class="muted">'+n.filter(x=>x.trending&&!x.deleted_at).length+' active stories</p></div></div></div><div class="panel"><h3>Quick actions</h3><div class="toolbar"><button class="btn" onclick="show('articles')">Manage articles</button><button class="btn secondary" onclick="show('review')">Open review queue</button><button class="btn secondary" onclick="show('categories')">Manage categories</button><button class="btn secondary" onclick="show('homepage')">Arrange homepage</button></div></div>'}
async function articles(){const [n,c]=await Promise.all([loadNews(200),loadCats()]);let rows=n.filter(x=>!x.deleted_at);if(role==='category_editor')rows=rows.filter(x=>allowedCats.includes(x.category_id)||allowedCats.includes(x.subcategory_id));document.getElementById('content').innerHTML='<div class="panel"><div class="toolbar"><input class="search" id="articleSearch" placeholder="Search title, author, category…"><select id="articleFilter"><option value="">All statuses</option><option value="published">Published</option><option value="draft">Draft</option><option value="pending">Pending</option><option value="featured">Featured</option><option value="breaking">Breaking</option><option value="trending">Trending</option><option value="sponsored">Sponsored</option></select><button class="btn" id="newArticle">New article</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Story</th><th>Category</th><th>Flags</th><th>Status</th><th>Actions</th></tr></thead><tbody id="articleRows"></tbody></table></div></div>';const render=()=>{let s=document.getElementById('articleSearch').value.toLowerCase(),f=document.getElementById('articleFilter').value;let x=rows.filter(a=>(a.title+' '+(a.author||'')+' '+(a.category||'')).toLowerCase().includes(s));if(f)x=x.filter(a=>f==='published'?a.published:f==='draft'?!a.published:f==='pending'?a.approval_status==='pending':!!a[f]);document.getElementById('articleRows').innerHTML=x.map(a=>'<tr><td><b>'+esc(a.title)+'</b><div class="muted small">'+esc(a.author||'Mbale Media')+'</div></td><td>'+esc(a.category||'')+'</td><td>'+(a.breaking?'<span class="badge red">BREAKING</span>':'')+(a.featured?'<span class="badge gold">FEATURED</span>':'')+(a.trending?'<span class="badge green">TRENDING</span>':'')+(a.sponsored?'<span class="badge">SPONSORED</span>':'')+'</td><td>'+esc(a.published?'Published':a.approval_status||'Draft')+'</td><td><button class="btn secondary small" onclick="editArticle('+a.id+')">Edit</button> <button class="btn danger small" onclick="trashArticle('+a.id+')">Trash</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">No articles found.</td></tr>'};render();document.getElementById('articleSearch').oninput=render;document.getElementById('articleFilter').onchange=render;document.getElementById('newArticle').onclick=()=>editArticle(null)}
async function editArticle(id){if(!canEdit())return toast('Your role cannot edit articles.');const [n,c]=await Promise.all([id?sb.from('news').select('*').eq('id',id).single():Promise.resolve({data:{title:'',excerpt:'',content:'',category:'',category_id:null,subcategory_id:null,author:'',featured:false,breaking:false,trending:false,sponsored:false,published:false,approval_status:'draft'}}),loadCats()]);const a=n.data;const subs=c.filter(x=>x.parent_id);document.getElementById('content').innerHTML='<div class="panel"><h3>'+(id?'Edit article':'New article')+'</h3><div class="two"><div><label>Headline</label><input id="aTitle" value="'+esc(a.title)+'"><label>Excerpt</label><textarea id="aExcerpt">'+esc(a.excerpt)+'</textarea><label>Content</label><textarea id="aContent" style="min-height:280px">'+esc(a.content)+'</textarea></div><div><label>Author</label><input id="aAuthor" value="'+esc(a.author||'')+'"><label>Main category</label><select id="aCat">'+catsOptions(c.filter(x=>!x.parent_id))+'</select><label>Subcategory</label><select id="aSub">'+catsOptions(subs)+'</select><label>Image URL</label><input id="aImage" value="'+esc(a.image_url||'')+'"><div class="two" style="margin-top:12px"><label class="check"><input id="aPublished" type="checkbox" '+(a.published?'checked':'')+'> Published</label><label class="check"><input id="aBreaking" type="checkbox" '+(a.breaking?'checked':'')+'> Breaking</label><label class="check"><input id="aFeatured" type="checkbox" '+(a.featured?'checked':'')+'> Featured</label><label class="check"><input id="aTrending" type="checkbox" '+(a.trending?'checked':'')+'> Trending</label><label class="check"><input id="aSponsored" type="checkbox" '+(a.sponsored?'checked':'')+'> Sponsored</label></div></div></div><div class="toolbar" style="margin-top:15px"><button class="btn" id="saveArticle">Save article</button><button class="btn secondary" onclick="show('articles')">Cancel</button></div></div>';document.getElementById('aCat').value=a.category_id||'';document.getElementById('aSub').value=a.subcategory_id||'';document.getElementById('aCat').onchange=()=>{const parent=+document.getElementById('aCat').value;document.getElementById('aSub').innerHTML=catsOptions(c.filter(x=>x.parent_id===parent))};document.getElementById('saveArticle').onclick=async()=>{const payload={title:document.getElementById('aTitle').value,excerpt:document.getElementById('aExcerpt').value,content:document.getElementById('aContent').value,author:document.getElementById('aAuthor').value,image_url:document.getElementById('aImage').value,category_id:+document.getElementById('aCat').value||null,subcategory_id:+document.getElementById('aSub').value||null,published:document.getElementById('aPublished').checked,breaking:document.getElementById('aBreaking').checked,featured:document.getElementById('aFeatured').checked,trending:document.getElementById('aTrending').checked,sponsored:document.getElementById('aSponsored').checked,approval_status:document.getElementById('aPublished').checked?'approved':'draft',updated_at:new Date().toISOString()};payload.category=c.find(x=>x.id===payload.category_id)?.name||a.category||'';if(!payload.title)return toast('Headline is required.');let r=id?await sb.from('news').update(payload).eq('id',id):await sb.from('news').insert(payload);if(r.error)return toast(r.error.message);await audit(id?'update_article':'create_article','news',id||'new',payload);toast('Article saved.');show('articles')}}
async function trashArticle(id){if(!confirm('Move this article to Trash?'))return;let r=await sb.from('news').update({deleted_at:new Date().toISOString(),deleted_by:me.id,published:false}).eq('id',id);if(r.error)return toast(r.error.message);await audit('trash_article','news',id);toast('Moved to Trash.');show('articles')}
async function review(){const r=await sb.from('journalist_submissions').select('*').in('status',['pending','changes_requested']).order('created_at',{ascending:false});if(r.error)return toast(r.error.message);document.getElementById('content').innerHTML='<div class="panel"><h3>Journalist Review Queue</h3><div class="tablewrap"><table class="table"><thead><tr><th>Story</th><th>Reporter</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td><b>'+esc(x.title)+'</b><div class="muted small">'+esc(x.excerpt||'')+'</div></td><td>'+esc(x.reporter_name)+'</td><td>'+esc(x.category)+'</td><td><span class="badge '+(x.status==='pending'?'gold':'red')+'">'+esc(x.status)+'</span></td><td><button class="btn small" onclick="reviewSubmission('+x.id+')">Open</button></td></tr>').join('')+'</tbody></table></div></div>'}
async function reviewSubmission(id){let r=await sb.from('journalist_submissions').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const x=r.data;document.getElementById('content').innerHTML='<div class="panel"><h3>'+esc(x.title)+'</h3><p class="muted">By '+esc(x.reporter_name)+' • '+esc(x.category)+'</p><label>Editor note</label><textarea id="reviewNote">'+esc(x.admin_note||'')+'</textarea><div class="toolbar"><button class="btn green" onclick="approveSubmission('+id+')">Approve & Publish</button><button class="btn gold" onclick="requestChanges('+id+')">Request Changes</button><button class="btn danger" onclick="rejectSubmission('+id+')">Reject</button><button class="btn secondary" onclick="show(\'review\')">Back</button></div><div class="panel"><h3>Story content</h3><p>'+esc(x.content||'').replace(/\n/g,'</p><p>')+'</p></div></div>'}
async function approveSubmission(id){let r=await sb.from('journalist_submissions').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const x=r.data;let ins=await sb.from('news').insert({title:x.title,slug:x.slug,excerpt:x.excerpt,content:x.content,image_url:x.image_url,category:x.category,author:x.reporter_name,author_id:x.journalist_id,published:true,approval_status:'approved',reviewer_id:me.id,reviewed_at:new Date().toISOString()}).select('id').single();if(ins.error)return toast(ins.error.message);await sb.from('journalist_submissions').update({status:'approved',editor_id:me.id,published_news_id:ins.data.id,reviewed_at:new Date().toISOString(),admin_note:document.getElementById('reviewNote').value}).eq('id',id);toast('Published.');show('review')}
async function requestChanges(id){let r=await sb.from('journalist_submissions').update({status:'changes_requested',editor_id:me.id,admin_note:document.getElementById('reviewNote').value,reviewed_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);toast('Changes requested.');show('review')}
async function rejectSubmission(id){if(!confirm('Reject this submission?'))return;let r=await sb.from('journalist_submissions').update({status:'rejected',editor_id:me.id,admin_note:document.getElementById('reviewNote').value,reviewed_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);toast('Rejected.');show('review')}
async function categories(){if(!canAdmin())return toast('Admin access required.');const c=await loadCats();document.getElementById('content').innerHTML='<div class="two"><div class="panel"><h3>Create category / subcategory</h3><label>Name</label><input id="catName"><label>Parent category (leave blank for main category)</label><select id="catParent">'+catsOptions(c.filter(x=>!x.parent_id))+'</select><label>Slug</label><input id="catSlug"><label>Description</label><textarea id="catDesc"></textarea><label>Sort order</label><input id="catSort" type="number" value="0"><label class="check"><input id="catHome" type="checkbox" checked> Show on homepage</label><button class="btn" style="margin-top:12px" id="addCat">Create</button></div><div class="panel"><h3>Category tree</h3><div id="catTree">'+c.filter(x=>!x.parent_id).map(p=>'<div style="padding:10px 0;border-bottom:1px solid #1b2a33"><b>'+esc(p.name)+'</b> <span class="muted small">#'+p.id+'</span> <button class="btn danger small" onclick="deleteCat('+p.id+')">Archive</button>'+c.filter(x=>x.parent_id===p.id).map(s=>'<div style="margin:8px 0 0 18px">↳ '+esc(s.name)+' <button class="btn danger small" onclick="deleteCat('+s.id+')">Archive</button></div>').join('')+'</div>').join('')+'</div></div></div>';document.getElementById('addCat').onclick=async()=>{const name=document.getElementById('catName').value.trim();if(!name)return toast('Name required.');const slug=(document.getElementById('catSlug').value.trim()||name.toLowerCase().replace(/[^a-z0-9]+/g,'-')).replace(/^-|-$/g,'');let r=await sb.from('categories').insert({name,slug,parent_id:+document.getElementById('catParent').value||null,description:document.getElementById('catDesc').value,sort_order:+document.getElementById('catSort').value||0,show_on_homepage:document.getElementById('catHome').checked,active:true});if(r.error)return toast(r.error.message);toast('Category created.');categories()}}
async function deleteCat(id){if(!confirm('Archive this category?'))return;let r=await sb.from('categories').update({active:false}).eq('id',id);if(r.error)return toast(r.error.message);toast('Category archived.');categories()}
async function tags(){if(!canAdmin())return toast('Admin access required.');const t=await loadTags();document.getElementById('content').innerHTML='<div class="panel"><h3>Tags</h3><div class="toolbar"><input id="tagName" placeholder="New tag name"><button class="btn" id="addTag">Add tag</button></div><div>'+t.map(x=>'<span class="badge">#'+esc(x.name)+' <button style="background:none;border:0;color:#ff8b9e" onclick="deleteTag('+x.id+')">×</button></span>').join(' ')+'</div></div>';document.getElementById('addTag').onclick=async()=>{const name=document.getElementById('tagName').value.trim();if(!name)return;let r=await sb.from('tags').insert({name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')});if(r.error)return toast(r.error.message);toast('Tag added.');tags()}}
async function deleteTag(id){if(!confirm('Delete tag?'))return;let r=await sb.from('tags').delete().eq('id',id);if(r.error)return toast(r.error.message);tags()}
async function homepage(){if(!canAdmin())return toast('Admin access required.');const [c,h]=await Promise.all([loadCats(),sb.from('homepage_sections').select('*').order('sort_order')]);document.getElementById('content').innerHTML='<div class="panel"><h3>Homepage Manager</h3><p class="muted">Control which category sections appear on the public homepage and their order/limits.</p><div class="tablewrap"><table class="table"><thead><tr><th>Order</th><th>Section</th><th>Visible</th><th>Stories</th><th>Save</th></tr></thead><tbody>'+(h.data||[]).map(x=>'<tr><td><input id="ho'+x.id+'" type="number" value="'+x.sort_order+'" style="width:80px"></td><td>'+esc(x.title||c.find(z=>z.id===x.category_id)?.name||'')+'</td><td><input id="hv'+x.id+'" type="checkbox" '+(x.visible?'checked':'')+'></td><td><input id="hl'+x.id+'" type="number" value="'+x.article_limit+'" style="width:80px"></td><td><button class="btn small" onclick="saveHome('+x.id+')">Save</button></td></tr>').join('')+'</tbody></table></div></div>'}
async function saveHome(id){let r=await sb.from('homepage_sections').update({sort_order:+document.getElementById('ho'+id).value,visible:document.getElementById('hv'+id).checked,article_limit:+document.getElementById('hl'+id).value||6}).eq('id',id);if(r.error)return toast(r.error.message);toast('Homepage section saved.')}
async function staff(){if(!canAdmin())return toast('Admin access required.');const [r,c]=await Promise.all([sb.from('editor_roles').select('*').order('created_at'),loadCats()]);document.getElementById('content').innerHTML='<div class="two"><div class="panel"><h3>Staff roles</h3><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.email)+'</td><td><select onchange="changeRole(\''+x.user_id+'\',this.value)"><option value="admin" '+(x.role==='admin'?'selected':'')+'>Admin</option><option value="editor" '+(x.role==='editor'?'selected':'')+'>Editor</option><option value="category_editor" '+(x.role==='category_editor'?'selected':'')+'>Category Editor</option><option value="media_manager" '+(x.role==='media_manager'?'selected':'')+'>Media Manager</option><option value="ad_manager" '+(x.role==='ad_manager'?'selected':'')+'>Ads Manager</option></select></td><td><input type="checkbox" '+(x.active?'checked':'')+' onchange="changeActive(\''+x.user_id+'\',this.checked)"></td></tr>').join('')+'</tbody></table></div></div><div class="panel"><h3>Category permissions</h3><p class="muted">For Category Editor users, assign category access by user UUID.</p><label>User UUID</label><input id="permUser" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><label>Category</label><select id="permCat">'+catsOptions(c)+'</select><button class="btn" id="grant">Grant access</button><div id="permList" style="margin-top:15px"></div></div></div>';document.getElementById('grant').onclick=async()=>{let r=await sb.from('editor_category_access').insert({editor_id:document.getElementById('permUser').value,category_id:+document.getElementById('permCat').value});if(r.error)return toast(r.error.message);toast('Category access granted.')};}
async function changeRole(id,v){let r=await sb.from('editor_roles').update({role:v,updated_at:new Date().toISOString()}).eq('user_id',id);if(r.error)return toast(r.error.message);toast('Role updated.')}
async function changeActive(id,v){let r=await sb.from('editor_roles').update({active:v,updated_at:new Date().toISOString()}).eq('user_id',id);if(r.error)return toast(r.error.message);toast('Access updated.')}
async function journalists(){const r=await sb.from('journalist_submissions').select('id,reporter_name,title,category,status,created_at').order('created_at',{ascending:false}).limit(200);if(r.error)return toast(r.error.message);document.getElementById('content').innerHTML='<div class="panel"><h3>Journalists & submissions</h3><div class="tablewrap"><table class="table"><thead><tr><th>Reporter</th><th>Story</th><th>Category</th><th>Status</th><th>Date</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.reporter_name)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.category)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>'+new Date(x.created_at).toLocaleString()+'</td></tr>').join('')+'</tbody></table></div></div>'}
async function media(){if(!['admin','media_manager'].includes(role))return toast('Media Manager access required.');const r=await sb.from('media_assets').select('*').order('created_at',{ascending:false});document.getElementById('content').innerHTML='<div class="panel"><h3>Video / Photo / Audio Manager</h3><div class="toolbar"><input id="mTitle" placeholder="Title"><select id="mType"><option>photo</option><option>video</option><option>audio</option></select><input id="mUrl" placeholder="Media URL"><button class="btn" id="mAdd">Add media</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Title</th><th>Type</th><th>URL</th><th>Active</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.media_type)+'</td><td>'+esc(x.url)+'</td><td>'+esc(x.active)+'</td></tr>').join('')+'</tbody></table></div></div>';document.getElementById('mAdd').onclick=async()=>{let r=await sb.from('media_assets').insert({title:document.getElementById('mTitle').value,media_type:document.getElementById('mType').value,url:document.getElementById('mUrl').value,created_by:me.id});if(r.error)return toast(r.error.message);toast('Media saved.');media()}}
async function ads(){if(!['admin','ad_manager'].includes(role))return toast('Ads Manager access required.');const r=await sb.from('advertisements').select('*').order('created_at',{ascending:false});document.getElementById('content').innerHTML='<div class="panel"><h3>Ads Manager</h3><div class="toolbar"><input id="adName" placeholder="Campaign / ad name"><input id="adSlot" placeholder="Slot e.g. homepage-top"><input id="adImage" placeholder="Image URL"><input id="adTarget" placeholder="Target URL"><button class="btn" id="adAdd">Create ad</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Slot</th><th>Active</th><th>Dates</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.slot)+'</td><td>'+esc(x.active)+'</td><td>'+esc(x.start_at||'')+' — '+esc(x.end_at||'')+'</td></tr>').join('')+'</tbody></table></div></div>';document.getElementById('adAdd').onclick=async()=>{let r=await sb.from('advertisements').insert({name:document.getElementById('adName').value,slot:document.getElementById('adSlot').value,image_url:document.getElementById('adImage').value,target_url:document.getElementById('adTarget').value});if(r.error)return toast(r.error.message);toast('Ad created.');ads()}}
async function analytics(){const n=await loadNews(500);document.getElementById('content').innerHTML='<div class="grid"><div class="stat"><b>'+n.length+'</b><span>Articles in newsroom</span></div><div class="stat"><b>'+n.filter(x=>x.published).length+'</b><span>Published</span></div><div class="stat"><b>'+n.filter(x=>x.featured).length+'</b><span>Featured</span></div><div class="stat"><b>'+n.filter(x=>x.trending).length+'</b><span>Trending</span></div></div><div class="panel"><h3>Analytics foundation</h3><p class="muted">The newsroom now has a dedicated analytics area. Public page-view/event tracking can be connected here without exposing administration controls on the public site.</p></div>'}
async function settings(){if(!canAdmin())return toast('Admin access required.');const r=await sb.from('site_settings').select('*').order('key');document.getElementById('content').innerHTML='<div class="panel"><h3>Site settings</h3>'+(r.data||[]).map(x=>'<div class="row" style="margin:10px 0"><input id="setk'+x.key.replace(/\W/g,'')+'" value="'+esc(x.key)+'" disabled><input id="setv'+x.key.replace(/\W/g,'')+'" value="'+esc(x.value)+'"><button class="btn" onclick="saveSetting(\''+esc(x.key)+'\')">Save</button></div>').join('')+'</div>'}
async function saveSetting(k){const id=k.replace(/\W/g,'');let r=await sb.from('site_settings').upsert({key:k,value:document.getElementById('setv'+id).value,updated_by:me.id,updated_at:new Date().toISOString()});if(r.error)return toast(r.error.message);toast('Setting saved.')}
async function trash(){if(!canAdmin())return toast('Admin access required.');const r=await sb.from('news').select('id,title,deleted_at,deleted_by').not('deleted_at','is',null).order('deleted_at',{ascending:false});document.getElementById('content').innerHTML='<div class="panel"><h3>Trash / Recovery</h3><div class="tablewrap"><table class="table"><thead><tr><th>Story</th><th>Deleted</th><th>Action</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+new Date(x.deleted_at).toLocaleString()+'</td><td><button class="btn green small" onclick="restoreArticle('+x.id+')">Restore</button></td></tr>').join('')||'<tr><td colspan="3" class="empty">Trash is empty.</td></tr>'+'</tbody></table></div></div>'}
async function restoreArticle(id){let r=await sb.from('news').update({deleted_at:null,deleted_by:null}).eq('id',id);if(r.error)return toast(r.error.message);toast('Article restored.');trash()}
async function audit(action,type,id,details={}){if(!canAdmin())return;await sb.from('admin_audit_log').insert({user_id:me.id,action,entity_type:type,entity_id:String(id),details})}
const views={dashboard,articles,review,homepage,categories,tags,staff,journalists,media,ads,analytics,settings,trash};
async function show(v){if(!views[v])return;document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('viewTitle').textContent=v.replace(/(^|_)/g,' ').replace(/^./,m=>m.toUpperCase()).replace('Homepage','Homepage');document.getElementById('content').innerHTML='<div class="panel"><div class="empty">Loading…</div></div>';try{await views[v]()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="panel"><div class="error">'+esc(e.message||e)+'</div></div>'}}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;me=session.user;try{const rr=await getRole();if(!rr)throw Error('Your account is not authorized for the private newsroom.');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userBox').innerHTML=esc(rr.full_name||me.email)+'<br><span class="badge">'+esc(rr.role)+'</span>';document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));await show('dashboard')}catch(e){document.getElementById('loginError').textContent=e.message;await sb.auth.signOut()}}
document.getElementById('loginBtn').onclick=async()=>{document.getElementById('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){document.getElementById('loginError').textContent=error.message;return}await boot()};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload()});boot();
</script><script src="assets/mbale-media-ai.js" defer></script>
</body></html>
